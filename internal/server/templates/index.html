<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>Aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #F4F1EA;
            --grid-color: rgba(0, 0, 0, 0.05);
            --primary: #C85A27;
            --text-main: #111111;
            --border-width: 2px;
            --shadow-offset: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            /* Subtle Grid Background */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Space Mono', monospace;
            color: var(--text-main);
            position: relative;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            padding-top: calc(env(safe-area-inset-top, 24px) + 24px);
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }

        /* Brutalist Title Bar */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--text-main);
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border: var(--border-width) solid var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            font-family: 'Anton', sans-serif;
        }

        .logo-text {
            font-family: 'Anton', sans-serif;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .connection-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border: 1px solid var(--text-main);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .main-title {
            font-family: 'Anton', sans-serif;
            font-size: 36px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Brutalist Button */
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 300px;
            padding: 16px 24px;
            background: var(--primary);
            border: var(--border-width) solid var(--text-main);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--text-main);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .action-btn:active {
            transform: translate(var(--shadow-offset), var(--shadow-offset));
            box-shadow: 0 0 0 0 var(--text-main);
        }

        /* Panels */
        .transfer-panel, .receive-panel {
            width: 100%;
            max-width: 320px;
            padding: 20px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--text-main);
            display: none;
            flex-direction: column;
        }

        .transfer-panel.active, .receive-panel.active {
            display: flex;
        }

        .transfer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: var(--border-width) solid var(--text-main);
            padding-bottom: 12px;
        }

        .transfer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transfer-icon {
            width: 36px;
            height: 36px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transfer-name {
            font-size: 14px;
            font-weight: 700;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transfer-status {
            font-size: 12px;
            font-weight: 400;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .preset-btn {
            background: #fff; border: 2px solid #111; font-family: 'Space Mono'; font-size: 12px; font-weight: bold; padding: 4px 8px; cursor: pointer; transition: all 0.2s;
        }
        .preset-btn:active {
            background: #111; color: #fff;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border: 1px solid var(--text-main);
            animation: pulse 1s infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .progress-bar {
            height: 12px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            margin-bottom: 16px;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
            border-right: var(--border-width) solid var(--text-main);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .stat {
            text-align: left;
        }
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .stat-value {
            font-size: 14px;
            font-weight: 700;
        }

        .cancel-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: 2px 2px 0 0 var(--text-main);
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }
        .cancel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 0 var(--text-main);
        }

        /* Receive Panel */
        .receive-panel {
            align-items: center;
            text-align: center;
        }
        .receive-icon-wrapper {
            width: 64px;
            height: 64px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: 4px 4px 0 0 var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .receive-icon-wrapper svg {
            width: 32px;
            height: 32px;
            color: var(--text-main);
        }
        .receive-filename {
            font-family: 'Anton', sans-serif;
            font-size: 24px;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .receive-message {
            font-size: 12px;
            margin-bottom: 24px;
            border: var(--border-width) solid var(--text-main);
            padding: 8px;
            background: #fff;
        }
        .receive-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--text-main);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-block;
        }
        .receive-btn:active {
            transform: translate(var(--shadow-offset), var(--shadow-offset));
            box-shadow: 0 0 0 0 var(--text-main);
        }
        .receive-done-btn {
            background: #fff;
            color: var(--text-main);
        }

        /* Recent Files */
        .recents {
            width: 100%;
            max-width: 320px;
        }
        .recents-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            border-bottom: var(--border-width) solid var(--text-main);
            padding-bottom: 4px;
        }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: 2px 2px 0 0 var(--text-main);
            margin-bottom: 12px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .recent-icon {
            width: 32px;
            height: 32px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .recent-name {
            flex: 1;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-badge {
            font-size: 10px;
            padding: 2px 6px;
            border: 1px solid var(--text-main);
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Stats Banner */
        .stats-banner {
            width: 100%;
            max-width: 320px;
            padding: 12px;
            background: #fff;
            border: var(--border-width) solid var(--text-main);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--text-main);
            margin-bottom: 20px;
            display: none;
        }
        .stats-banner.show {
            display: block;
        }
        .stats-banner-content {
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            color: var(--primary);
        }

        /* Bottom Bar */
        .bottom-bar {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: auto;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="logo">
                <div class="logo-icon">A</div>
                <span class="logo-text">Aero</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="connection-badge" id="bugReportBtn" style="cursor: pointer; background: var(--bg-base); transition: all 0.2s;" onmouseover="this.style.background='var(--primary)'; this.style.color='#fff'" onmouseout="this.style.background='var(--bg-base)'; this.style.color='var(--text-main)'">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Bug
                </button>
                <!-- Bug Report Modal -->
            <div id="bugModal" style="display: none; position: fixed; inset: 0; background: rgba(244,241,234,0.95); z-index: 100; flex-direction: column; padding: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid #111; padding-bottom: 12px;">
                    <h2 style="font-family: 'Anton'; text-transform: uppercase; font-size: 24px;">Report a Bug</h2>
                    <button id="closeBugBtn" style="background: none; border: none; cursor: pointer;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
                    <button class="preset-btn" onclick="document.getElementById('bugText').value += (document.getElementById('bugText').value ? '\n' : '') + '[Connection Issue] '">Connection Issue</button>
                    <button class="preset-btn" onclick="document.getElementById('bugText').value += (document.getElementById('bugText').value ? '\n' : '') + '[Transfer Failed] '">Transfer Failed</button>
                    <button class="preset-btn" onclick="document.getElementById('bugText').value += (document.getElementById('bugText').value ? '\n' : '') + '[UI Bug] '">UI Bug</button>
                    <button class="preset-btn" onclick="document.getElementById('bugText').value += (document.getElementById('bugText').value ? '\n' : '') + '[Feature Request] '">Feature</button>
                </div>
                
                <div id="bugSuccessState" style="display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; background: #4ade80; border: 2px solid #111; margin-bottom: 24px; animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <h3 style="font-family: 'Anton'; margin-top: 16px; font-size: 20px; color: #111; letter-spacing: 1px;">BUG SQUASHED!</h3>
                </div>

                <textarea id="bugText" style="flex: 1; width: 100%; border: 2px solid #111; padding: 12px; font-family: 'Space Mono'; font-size: 14px; margin-bottom: 24px; resize: none;" placeholder="Describe the issue..."></textarea>
                <button id="submitBugBtn" class="action-btn" style="margin-bottom: 0;">Submit Report</button>
            </div>
                <div class="connection-badge">
                    <div class="connection-dot" id="connDot"></div>
                    <span id="connText">Connected</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Stats Banner (permanent display) -->
            <div class="stats-banner" id="statsBanner">
                <div class="stats-banner-content" id="statsContent">--</div>
            </div>

            <h1 class="main-title" id="mainTitle">Send Files to PC</h1>

            <!-- Action Button -->
            <button class="action-btn" id="selectBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                Select Files
            </button>

            <!-- Transfer Panel -->
            <div class="transfer-panel" id="transferPanel">
                <div class="transfer-header">
                    <div class="transfer-info">
                        <div class="transfer-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </div>
                        <div>
                            <div class="transfer-name" id="fileName">file.zip</div>
                            <div class="transfer-status" id="transferStatus">Sending...</div>
                        </div>
                    </div>
                    <div class="live-badge">Live</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-label">Speed</div>
                        <div class="stat-value highlight" id="speedStat">0 MB/s</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Progress</div>
                        <div class="stat-value" id="progressStat">0%</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">ETA</div>
                        <div class="stat-value" id="etaStat">--</div>
                    </div>
                </div>
                <button class="cancel-btn" id="cancelBtn">Tap to cancel</button>
            </div>

            <!-- Receive Panel -->
            <div class="receive-panel" id="receivePanel">
                <div class="receive-icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                </div>
                <div class="receive-filename" id="receiveFilename">file.zip</div>
                <div class="receive-message">
                    <strong>Download Started!</strong><br/>
                    Check your notifications or downloads folder for progress.
                </div>
                <a href="#" class="receive-btn" id="receiveBtn">Download Manually</a>
                <button class="receive-btn receive-done-btn" id="receiveDoneBtn">Done</button>
            </div>

            <!-- Recent Files -->
            <div class="recents" id="recents"></div>
            <!-- Bottom Stats (Recent Files zone) -->
            <div class="bottom-bar">
                <div id="recentFilesContainer" style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- Recent items will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" multiple>

    <script>
        /**
         * AERO Mobile Client
         * Matching desktop aesthetic with glassmorphism design
         */
        (function () {
            'use strict';

            const MAX_CHUNK_SIZE = 10 * 1024 * 1024;
            const IV_SIZE = 16;

            // DOM
            const selectBtn = document.getElementById('selectBtn');
            const fileInput = document.getElementById('fileInput');
            const transferPanel = document.getElementById('transferPanel');
            const fileName = document.getElementById('fileName');
            const transferStatus = document.getElementById('transferStatus');
            const progressFill = document.getElementById('progressFill');
            const speedStat = document.getElementById('speedStat');
            const progressStat = document.getElementById('progressStat');
            const etaStat = document.getElementById('etaStat');
            const recentsDiv = document.getElementById('recents');
            const mainTitle = document.getElementById('mainTitle');
            const cancelBtn = document.getElementById('cancelBtn');
            const statsBanner = document.getElementById('statsBanner');
            const statsContent = document.getElementById('statsContent');

            // State
            let recentFiles = [];
            let cryptoKey = null;
            let encryptionEnabled = false;
            let sessionIV = null;
            let activeXHR = null; // For cancel functionality

            // Crypto functions
            function extractKeyFromHash() {
                const hash = window.location.hash;
                if (!hash || !hash.includes('key=')) return null;
                const keyMatch = hash.match(/key=([A-Za-z0-9_-]+)/);
                return keyMatch ? keyMatch[1] : null;
            }

            async function importKey(base64Key) {
                try {
                    const keyStr = base64Key.replace(/-/g, '+').replace(/_/g, '/');
                    const keyBytes = Uint8Array.from(atob(keyStr), c => c.charCodeAt(0));
                    if (keyBytes.length !== 32) throw new Error('Invalid key size');
                    cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CTR' }, false, ['encrypt']);
                    sessionIV = crypto.getRandomValues(new Uint8Array(IV_SIZE));
                    encryptionEnabled = true;
                    console.log('[CRYPTO] ✅ Encryption enabled');
                    return true;
                } catch (e) {
                    console.error('[CRYPTO] ❌ Key import failed:', e);
                    return false;
                }
            }

            async function encryptChunk(buffer, chunkIndex) {
                if (!encryptionEnabled) return buffer;
                const counter = new Uint8Array(sessionIV);
                const view = new DataView(counter.buffer);
                const offset = chunkIndex * Math.ceil(MAX_CHUNK_SIZE / 16);
                view.setBigUint64(8, BigInt(offset), false);
                return await crypto.subtle.encrypt({ name: 'AES-CTR', counter, length: 64 }, cryptoKey, buffer);
            }

            // Init crypto
            (async () => {
                const key = extractKeyFromHash();
                if (key) await importKey(key);
            })();

            // ═══════════════════════════════════════════════════════════
            // WebSocket Client (Phone -> PC presence & Download)
            // ═══════════════════════════════════════════════════════════

            let ws;
            let incomingFile = null;
            let receivedChunks = [];
            let receivedBytes = 0;
            let receiveStartTime = 0;
            let receiveLastTime = 0;
            let receiveLastBytes = 0;

            function connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/transfer`);
                ws.binaryType = 'arraybuffer'; // Critical for binary handling

                ws.onopen = () => {
                    const txt = document.getElementById('connText');
                    const dot = document.getElementById('connDot');
                    if(txt) txt.textContent = 'Connected';
                    if(dot) dot.style.background = '#10b981'; // Green
                    if(dot) dot.style.animation = 'pulse 1s infinite alternate';
                    haptics.success();
                };

                ws.onclose = () => {
                    const txt = document.getElementById('connText');
                    const dot = document.getElementById('connDot');
                    if(txt) txt.textContent = 'Disconnected';
                    if(dot) dot.style.background = '#ef4444'; // Red
                    if(dot) dot.style.animation = 'none';
                    setTimeout(connectWebSocket, 2000);
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        handleBinaryChunk(event.data);
                    } else {
                        try {
                            const msg = JSON.parse(event.data);
                            handleControlMessage(msg);
                        } catch (e) { console.error(e); }
                    }
                };
            }

            function handleControlMessage(msg) {
                if (msg.type === 'file_incoming') {
                    // Start download UI
                    incomingFile = msg;
                    receivedChunks = [];
                    receivedBytes = 0;
                    receiveStartTime = Date.now();
                    receiveLastTime = receiveStartTime;
                    receiveLastBytes = 0;

                    mainTitle.textContent = 'Receiving...';
                    fileName.textContent = msg.name;
                    transferStatus.textContent = formatBytes(msg.size);
                    transferPanel.classList.add('active');
                    selectBtn.style.display = 'none';
                    haptics.tick();
                }
                else if (msg.type === 'file_complete') {
                    // Finish & Save
                    transferComplete(msg.name, true);
                    saveFile(msg.name);
                }
                else if (msg.type === 'file_direct_download') {
                    // PC to Phone Direct Download
                    mainTitle.textContent = 'Incoming File...';
                    
                    receiveFilename.textContent = msg.name;
                    receiveBtn.href = msg.url;
                    receiveBtn.download = msg.name;
                    
                    // Show the dedicated receive panel
                    haptics.tick();
                    transferPanel.classList.remove('active');
                    selectBtn.style.display = 'none';
                    receivePanel.classList.add('active');
                    
                    // Trigger native browser download
                    const a = document.createElement('a');
                    a.href = msg.url;
                    a.download = msg.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    addRecentFile(msg.name, 'received');
                }
            }

            function handleBinaryChunk(buffer) {
                // Strip 4-byte header (chunk index)
                const data = buffer.slice(4);
                receivedChunks.push(data);
                receivedBytes += data.byteLength;

                // Update UI
                if (incomingFile) {
                    const progress = Math.min(100, Math.round((receivedBytes / incomingFile.size) * 100));
                    progressFill.style.width = progress + '%';
                    progressStat.textContent = progress + '%';

                    const now = Date.now();
                    const timeDiff = (now - receiveLastTime) / 1000;
                    if (timeDiff >= 0.5) {
                        const bytesDiff = receivedBytes - receiveLastBytes;
                        const speed = bytesDiff / timeDiff;
                        speedStat.textContent = formatSpeed(speed);

                        const remaining = incomingFile.size - receivedBytes;
                        const eta = speed > 0 ? remaining / speed : 0;
                        etaStat.textContent = formatEta(eta);

                        receiveLastTime = now;
                        receiveLastBytes = receivedBytes;
                    }
                }
            }

            function saveFile(filename) {
                const blob = new Blob(receivedChunks, { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                addRecentFile(filename, 'received');
            }

            // Connect immediately
            connectWebSocket();

            // File selection
            selectBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                for (const file of files) {
                    await uploadFile(file);
                }
                fileInput.value = '';
            });

            // Cancel button
            cancelBtn.addEventListener('click', () => {
                if (activeXHR) {
                    activeXHR.abort();
                    activeXHR = null;
                    transferCancelled();
                }
            });

            // Receive Done button
            receiveDoneBtn.addEventListener('click', () => {
                receivePanel.classList.remove('active');
                selectBtn.style.display = 'flex';
                mainTitle.textContent = 'Send Files to PC';
            });

            function transferCancelled() {
                mainTitle.textContent = 'Cancelled';
                transferStatus.textContent = 'Transfer cancelled';
                haptics.error();

                setTimeout(() => {
                    transferPanel.classList.remove('active');
                    selectBtn.style.display = 'flex';
                    mainTitle.textContent = 'Send Files to PC';
                    progressFill.style.width = '0%';
                }, 1500);
            }

            // Upload file
            // 🚀 SPEED PHASE 3: Parallel Multi-Stream Upload (50+ MB/s)
            async function uploadFile(file) {
                mainTitle.textContent = 'Sending...';
                fileName.textContent = file.name;
                transferStatus.textContent = 'Uploading...';
                transferPanel.classList.add('active');
                selectBtn.style.display = 'none';

                const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB per chunk
                const MAX_PARALLEL = 6; // 6 concurrent streams
                const totalSize = file.size;
                const totalChunks = Math.ceil(totalSize / CHUNK_SIZE);
                const sessionId = Date.now().toString() + Math.random().toString(36);

                let startTime = Date.now();
                let lastTime = startTime;
                let lastBytes = 0;

                // Track progress for each chunk
                const chunkProgress = new Array(totalChunks).fill(0);
                const activeUploads = new Set();
                const uploadQueue = [];

                // Populate upload queue
                for (let i = 0; i < totalChunks; i++) {
                    uploadQueue.push(i);
                }

                // Upload single chunk
                const uploadChunk = async (chunkIdx) => {
                    const start = chunkIdx * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, totalSize);
                    const blob = file.slice(start, end);

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/parallel-upload', true);

                    // Set headers for parallel upload
                    xhr.setRequestHeader('X-Session-Id', sessionId);
                    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
                    xhr.setRequestHeader('X-Chunk-Index', chunkIdx.toString());
                    xhr.setRequestHeader('X-Total-Chunks', totalChunks.toString());
                    xhr.setRequestHeader('X-Offset', start.toString());
                    xhr.setRequestHeader('X-Total-Size', totalSize.toString());

                    // Track individual chunk progress
                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            chunkProgress[chunkIdx] = e.loaded;
                            updateTotalProgress();
                        }
                    };

                    return new Promise((resolve, reject) => {
                        xhr.onload = () => {
                            if (xhr.status === 200) {
                                chunkProgress[chunkIdx] = blob.size; // Mark complete
                                resolve(chunkIdx);
                            } else {
                                reject(new Error(`Chunk ${chunkIdx} failed`));
                            }
                        };
                        xhr.onerror = () => reject(new Error(`Chunk ${chunkIdx} network error`));
                        xhr.send(blob);
                    });
                };

                // Update aggregated progress from all streams
                const updateTotalProgress = () => {
                    const uploaded = chunkProgress.reduce((a, b) => a + b, 0);
                    const progress = Math.min(100, Math.round((uploaded / totalSize) * 100));

                    progressFill.style.width = progress + '%';
                    progressStat.textContent = progress + '%';

                    const now = Date.now();
                    const timeDiff = (now - lastTime) / 1000;
                    if (timeDiff >= 0.5) {
                        const bytesDiff = uploaded - lastBytes;
                        const speed = bytesDiff / timeDiff;
                        speedStat.textContent = formatSpeed(speed);

                        const remaining = totalSize - uploaded;
                        const eta = speed > 0 ? remaining / speed : 0;
                        etaStat.textContent = formatEta(eta);

                        lastTime = now;
                        lastBytes = uploaded;
                    }
                };

                try {
                    // Upload in batches of MAX_PARALLEL chunks
                    // This ensures ALL chunks complete before moving to next batch
                    for (let batchStart = 0; batchStart < totalChunks; batchStart += MAX_PARALLEL) {
                        const batchEnd = Math.min(batchStart + MAX_PARALLEL, totalChunks);
                        const batch = [];

                        // Create batch of uploads
                        for (let i = batchStart; i < batchEnd; i++) {
                            batch.push(uploadChunk(i));
                        }

                        // Wait for ENTIRE batch to complete
                        await Promise.all(batch);

                        console.log(`Batch ${batchStart}-${batchEnd - 1} complete`);
                    }

                    // All chunks uploaded
                    console.log('All chunks uploaded successfully');
                    const totalTime = (Date.now() - startTime) / 1000;
                    const avgSpeed = totalSize / totalTime;
                    transferComplete(file.name, true, totalSize, totalTime, avgSpeed);

                } catch (error) {
                    console.error('Parallel upload failed:', error);
                    transferComplete(file.name, false);
                }
            }

            function transferComplete(name, success, totalBytes, totalTime, avgSpeed) {
                activeXHR = null; // Clear reference

                // Show stats in permanent banner
                if (success && totalBytes && totalTime) {
                    const speedMBps = (avgSpeed / (1024 * 1024)).toFixed(1);
                    const timeSec = totalTime.toFixed(1);

                    // Update banner (permanent)
                    statsContent.textContent = `${speedMBps} MB/s | ${timeSec}s`;
                    statsBanner.classList.add('show');
                    // No timeout - stays visible

                    console.log(`[STATS] 📊 ${name}: ${speedMBps} MB/s | ${timeSec}s`);
                }

                // Update transfer panel (which will hide after 2s)
                mainTitle.textContent = success ? 'Transfer Complete!' : 'Transfer Failed';
                transferStatus.textContent = success ? 'Sent successfully' : 'Error occurred';
                progressFill.style.width = '100%';
                progressStat.textContent = '100%';

                if (success) {
                    addRecentFile(name, 'sent');
                }

                setTimeout(() => {
                    transferPanel.classList.remove('active');
                    selectBtn.style.display = 'flex';
                    mainTitle.textContent = 'Send Files to PC';
                    progressFill.style.width = '0%';
                }, 2000);
            }

            function addRecentFile(name, type) {
                recentFiles.unshift({ name, type, time: Date.now() });
                if (recentFiles.length > 3) recentFiles.pop();
                renderRecents();
            }

            function renderRecents() {
                if (recentFiles.length === 0) {
                    recentsDiv.innerHTML = '';
                    return;
                }

                let html = '<div class="recents-header">Recent Transfers</div>';
                recentFiles.forEach(f => {
                    const icon = f.type === 'sent' ? '↑' : '↓';
                    html += `
                        <div class="recent-item">
                            <div class="recent-icon">${icon}</div>
                            <div class="recent-name">${f.name}</div>
                            <div class="recent-badge">${f.type}</div>
                        </div>
                    `;
                });
                recentsDiv.innerHTML = html;
            }

            function formatSpeed(bytesPerSec) {
                if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
                if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
                return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
            }

            function formatEta(seconds) {
                if (!seconds || seconds === Infinity) return '--';
                if (seconds < 60) return Math.ceil(seconds) + 's';
                const mins = Math.floor(seconds / 60);
                const secs = Math.ceil(seconds % 60);
                return mins + 'm ' + secs + 's';
            }

            // Haptics
            const haptics = {
                tick: () => navigator.vibrate?.(5),
                success: () => navigator.vibrate?.([50, 30, 50]),
                error: () => navigator.vibrate?.([300]),
            };
        })();
        
        // Bug Report Logic
        const bugModal = document.getElementById('bugModal');
        const bugReportBtn = document.getElementById('bugReportBtn');
        const closeBugBtn = document.getElementById('closeBugBtn');
        const submitBugBtn = document.getElementById('submitBugBtn');
        const bugText = document.getElementById('bugText');

        bugReportBtn.addEventListener('click', () => {
            bugModal.style.display = 'flex';
        });

        closeBugBtn.addEventListener('click', () => {
            bugModal.style.display = 'none';
        });

        submitBugBtn.addEventListener('click', async () => {
            const message = bugText.value.trim();
            if (!message) return;
            
            submitBugBtn.innerText = 'Sending...';
            submitBugBtn.disabled = true;
            
            try {
                const res = await fetch('/api/bug', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                if (res.ok) {
                    bugText.style.display = 'none';
                    document.getElementById('bugSuccessState').style.display = 'flex';
                    submitBugBtn.innerText = 'SENT!';
                    submitBugBtn.style.background = '#4ade80';
                    submitBugBtn.style.color = '#111';
                    
                    setTimeout(() => {
                        bugModal.style.display = 'none';
                        bugText.style.display = 'block';
                        document.getElementById('bugSuccessState').style.display = 'none';
                        submitBugBtn.innerText = 'Submit Report';
                        submitBugBtn.style.background = '';
                        submitBugBtn.style.color = '';
                        bugText.value = '';
                        submitBugBtn.disabled = false;
                    }, 2000);
                    return; // Wait for timeout before enabling
                } else {
                    alert('Failed to connect to reporting service. Please try again later.');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to connect to reporting service. Please check your connection.');
            }
            
            submitBugBtn.innerText = 'Submit Report';
            submitBugBtn.disabled = false;
        });

    </script>
</body>
