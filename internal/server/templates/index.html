<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }

        #vfx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .logo {
            position: absolute;
            top: 40px;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #fff;
        }

        .logo-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            margin-left: 2px;
            vertical-align: super;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .core-label {
            position: absolute;
            top: calc(50% + 100px);
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.5s ease;
        }

        .core-label.active {
            color: #10b981;
            text-shadow: 0 0 10px #10b981;
        }

        .stats {
            position: absolute;
            top: calc(50% + 140px);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .stats.visible {
            opacity: 1;
        }

        .stat-percent {
            font-size: 2.5rem;
            font-weight: 500;
            color: #10b981;
            text-shadow: 0 0 20px #10b981, 0 0 40px #10b981;
        }

        .stat-info {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .recents {
            position: absolute;
            bottom: 40px;
            width: calc(100% - 48px);
            max-width: 300px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .recent-icon {
            color: #10b981;
            font-size: 0.8rem;
        }

        .recent-name {
            flex: 1;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .touch-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: all;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="vfx"></canvas>

    <div id="ui-layer">
        <h1 class="logo">aero<span class="logo-dot"></span></h1>
        <div class="core-label" id="coreLabel">tap to send</div>
        <div class="stats" id="stats">
            <div class="stat-percent" id="statPercent">0%</div>
            <div class="stat-info" id="statInfo">—</div>
        </div>
        <div class="recents" id="recents"></div>
        <div class="touch-area" id="touchArea"></div>
    </div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        // ═══════════════════════════════════════════════════════════════
        // UFOTABLE PARTICLE ENGINE - "Digital Sorcery"
        // ═══════════════════════════════════════════════════════════════

        const canvas = document.getElementById('vfx');
        const ctx = canvas.getContext('2d');
        const touchArea = document.getElementById('touchArea');
        const fileInput = document.getElementById('fileInput');
        const coreLabel = document.getElementById('coreLabel');
        const stats = document.getElementById('stats');
        const statPercent = document.getElementById('statPercent');
        const statInfo = document.getElementById('statInfo');
        const recentsDiv = document.getElementById('recents');

        let W, H, centerX, centerY;
        const CORE_RADIUS = 70;
        const NEON = { r: 16, g: 185, b: 129 }; // #10b981

        // ═══════════════════════════════════════════════════════════════
        // PARTICLE CLASS
        // ═══════════════════════════════════════════════════════════════
        class Particle {
            constructor(x, y, vx, vy, life, size, type = 'ambient') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.size = size;
                this.type = type;
                this.trail = [];
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.sqrt(vx * vx + vy * vy);
            }

            update() {
                // Fluid motion - sine wave perturbation
                if (this.type === 'stream') {
                    const wave = Math.sin(this.y * 0.02 + performance.now() * 0.003) * 2;
                    this.x += wave * 0.3;
                }

                // Store trail
                if (this.type === 'stream' || this.type === 'burst') {
                    this.trail.push({ x: this.x, y: this.y, life: 20 });
                    if (this.trail.length > 15) this.trail.shift();
                }

                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Orbital motion for ambient particles
                if (this.type === 'orbit') {
                    this.angle += 0.02;
                    const dist = CORE_RADIUS + 20 + Math.sin(performance.now() * 0.002) * 10;
                    this.x = centerX + Math.cos(this.angle) * dist;
                    this.y = centerY + Math.sin(this.angle) * dist;
                }

                return this.life > 0;
            }

            draw() {
                const alpha = this.life / this.maxLife;

                // Trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, ${alpha * 0.3})`;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.stroke();
                }

                // Core glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 3
                );
                gradient.addColorStop(0, `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, ${alpha * 0.3})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Hot center
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                ctx.fill();
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // EMITTER CLASS
        // ═══════════════════════════════════════════════════════════════
        class Emitter {
            constructor() {
                this.particles = [];
                this.state = 'idle'; // idle, charging, streaming, burst
                this.progress = 0;
                this.shockwaves = [];
            }

            spawnAmbient() {
                // Orbital ring particles
                if (this.particles.filter(p => p.type === 'orbit').length < 8) {
                    const angle = Math.random() * Math.PI * 2;
                    const p = new Particle(
                        centerX + Math.cos(angle) * (CORE_RADIUS + 20),
                        centerY + Math.sin(angle) * (CORE_RADIUS + 20),
                        0, 0, 200, 2, 'orbit'
                    );
                    p.angle = angle;
                    this.particles.push(p);
                }

                // Floating dust
                if (Math.random() < 0.02) {
                    this.particles.push(new Particle(
                        Math.random() * W,
                        H + 10,
                        (Math.random() - 0.5) * 0.5,
                        -Math.random() * 0.5 - 0.2,
                        300, 1, 'ambient'
                    ));
                }
            }

            spawnStream() {
                // Intense particle stream from bottom, through core, shooting up
                for (let i = 0; i < 3; i++) {
                    const startX = centerX + (Math.random() - 0.5) * 60;
                    const speed = 8 + Math.random() * 4;
                    this.particles.push(new Particle(
                        startX,
                        H + 20,
                        (Math.random() - 0.5) * 2,
                        -speed,
                        120, 2 + Math.random() * 2, 'stream'
                    ));
                }
            }

            triggerBurst() {
                // Explosion burst
                for (let i = 0; i < 50; i++) {
                    const angle = (Math.PI * 2 / 50) * i + Math.random() * 0.3;
                    const speed = 5 + Math.random() * 8;
                    this.particles.push(new Particle(
                        centerX,
                        centerY,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        60, 2 + Math.random() * 2, 'burst'
                    ));
                }
                // Big flash
                this.shockwaves.push({ x: centerX, y: centerY, r: 0, maxR: 300, life: 30 });
            }

            triggerShockwave(x, y) {
                this.shockwaves.push({ x, y, r: 0, maxR: 150, life: 20 });
                // Scatter particles
                for (let i = 0; i < 12; i++) {
                    const angle = (Math.PI * 2 / 12) * i;
                    this.particles.push(new Particle(
                        x, y,
                        Math.cos(angle) * 3,
                        Math.sin(angle) * 3,
                        30, 2, 'burst'
                    ));
                }
            }

            update() {
                // Spawn based on state
                this.spawnAmbient();
                if (this.state === 'streaming') {
                    this.spawnStream();
                }

                // Update particles
                this.particles = this.particles.filter(p => p.update());

                // Update shockwaves
                this.shockwaves = this.shockwaves.filter(s => {
                    s.r += (s.maxR - s.r) * 0.15;
                    s.life--;
                    return s.life > 0;
                });
            }

            draw() {
                // Additive blending for glow
                ctx.globalCompositeOperation = 'lighter';

                // Draw particles
                for (const p of this.particles) {
                    p.draw();
                }

                // Draw shockwaves
                for (const s of this.shockwaves) {
                    const alpha = s.life / 20;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, ${alpha * 0.5})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                ctx.globalCompositeOperation = 'source-over';
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // THE CORE - Canvas-drawn button
        // ═══════════════════════════════════════════════════════════════
        function drawCore(progress = 0) {
            const pulseScale = 1 + Math.sin(performance.now() * 0.003) * 0.05;
            const r = CORE_RADIUS * pulseScale;

            // Outer glow
            const glowGradient = ctx.createRadialGradient(
                centerX, centerY, r * 0.5,
                centerX, centerY, r * 2
            );
            glowGradient.addColorStop(0, `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, 0.2)`);
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.beginPath();
            ctx.arc(centerX, centerY, r * 2, 0, Math.PI * 2);
            ctx.fillStyle = glowGradient;
            ctx.fill();

            // Progress ring
            if (progress > 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r + 8, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress / 100));
                ctx.strokeStyle = `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, 1)`;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Glow on progress
                ctx.shadowColor = `rgb(${NEON.r}, ${NEON.g}, ${NEON.b})`;
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Core ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, 0.6)`;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Inner fill
            ctx.beginPath();
            ctx.arc(centerX, centerY, r - 5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${NEON.r}, ${NEON.g}, ${NEON.b}, 0.05)`;
            ctx.fill();
        }

        // ═══════════════════════════════════════════════════════════════
        // RENDER LOOP
        // ═══════════════════════════════════════════════════════════════
        const emitter = new Emitter();
        let currentProgress = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            centerX = W / 2;
            centerY = H / 2;
        }

        function render() {
            // Clear with slight trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, W, H);

            emitter.update();
            emitter.draw();
            drawCore(currentProgress);

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        render();

        // ═══════════════════════════════════════════════════════════════
        // INTERACTION & UPLOAD LOGIC
        // ═══════════════════════════════════════════════════════════════
        const recents = [];
        let ws = null;
        let uploadData = null;
        let receiveData = null;
        let currentState = 'idle';

        const fmt = b => {
            if (!b) return '0 B';
            const i = Math.floor(Math.log(b) / Math.log(1024));
            return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
        };

        const addRecent = (name, type) => {
            recents.unshift({ name, type });
            if (recents.length > 3) recents.pop();
            recentsDiv.innerHTML = recents.map(r => `
            <div class="recent-item">
                <div class="recent-icon">${r.type === 'sent' ? '↑' : '↓'}</div>
                <div class="recent-name">${r.name}</div>
            </div>
        `).join('');
        };

        const resetToIdle = () => {
            currentState = 'idle';
            emitter.state = 'idle';
            currentProgress = 0;
            coreLabel.textContent = 'tap to send';
            coreLabel.classList.remove('active');
            stats.classList.remove('visible');
            uploadData = null;
            receiveData = null;
        };

        // Touch interaction
        touchArea.addEventListener('click', (e) => {
            if (currentState === 'idle') {
                const rect = touchArea.getBoundingClientRect();
                emitter.triggerShockwave(rect.left + rect.width / 2, rect.top + rect.height / 2);
                fileInput.click();
            }
        });

        // WebSocket message handler
        const handleMessage = (e) => {
            if (e.data instanceof ArrayBuffer && currentState === 'receiving' && receiveData) {
                const view = new DataView(e.data);
                const idx = view.getUint32(0, true);
                receiveData.chunks[idx] = new Uint8Array(e.data, 4);
                const pct = (receiveData.chunks.filter(c => c).length / receiveData.meta.chunks) * 100;
                currentProgress = Math.min(99, pct);
                statPercent.textContent = Math.round(pct) + '%';
                ws.send(JSON.stringify({ ack: idx }));
                return;
            }

            try {
                const msg = JSON.parse(e.data);

                if (currentState === 'uploading' && uploadData) {
                    if (msg.status === 'ready') uploadData.ready = true;
                    if (typeof msg.ack === 'number') {
                        uploadData.acked++;
                        currentProgress = Math.min(99, (uploadData.acked / uploadData.total) * 100);
                        statPercent.textContent = Math.round(currentProgress) + '%';
                        statInfo.textContent = fmt(uploadData.sent / ((Date.now() - uploadData.t0) / 1000)) + '/s';
                        if (uploadData.acked >= uploadData.total && uploadData.doneResolve) uploadData.doneResolve();
                    }
                    if (msg.status === 'success') {
                        emitter.triggerBurst();
                        currentProgress = 100;
                        statPercent.textContent = '100%';
                        coreLabel.textContent = 'sent';
                        coreLabel.classList.add('active');
                        addRecent(uploadData.name, 'sent');
                        setTimeout(resetToIdle, 2500);
                    }
                    return;
                }

                if (msg.type === 'file_incoming') {
                    currentState = 'receiving';
                    emitter.state = 'streaming';
                    receiveData = { meta: msg, chunks: new Array(msg.chunks) };
                    coreLabel.textContent = 'receiving';
                    stats.classList.add('visible');
                    statPercent.textContent = '0%';
                    statInfo.textContent = msg.name;
                }

                if (msg.type === 'file_complete' && receiveData) {
                    const blob = new Blob(receiveData.chunks);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = receiveData.meta.name;
                    a.click();
                    emitter.triggerBurst();
                    currentProgress = 100;
                    coreLabel.textContent = 'saved';
                    coreLabel.classList.add('active');
                    addRecent(receiveData.meta.name, 'received');
                    setTimeout(resetToIdle, 2500);
                }
            } catch { }
        };

        const connect = () => {
            ws = new WebSocket(`ws://${location.host}/transfer`);
            ws.binaryType = 'arraybuffer';
            ws.onmessage = handleMessage;
            ws.onclose = () => setTimeout(connect, 2000);
        };
        connect();

        async function upload(file) {
            if (currentState !== 'idle') return;
            currentState = 'uploading';
            emitter.state = 'streaming';

            const CHUNK = 1024 * 1024;
            const total = Math.ceil(file.size / CHUNK);
            uploadData = { name: file.name, total, acked: 0, sent: 0, t0: Date.now(), ready: false, doneResolve: null };

            coreLabel.textContent = 'sending';
            stats.classList.add('visible');
            statPercent.textContent = '0%';
            statInfo.textContent = file.name;
            currentProgress = 0;

            try {
                ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));
                await new Promise((r, j) => {
                    const c = () => uploadData.ready ? r() : setTimeout(c, 10);
                    c(); setTimeout(() => j(new Error('timeout')), 10000);
                });

                for (let i = 0; i < total; i++) {
                    const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                    const h = new ArrayBuffer(4); new DataView(h).setUint32(0, i, true);
                    const c = new Uint8Array(4 + d.byteLength);
                    c.set(new Uint8Array(h), 0); c.set(new Uint8Array(d), 4);
                    ws.send(c);
                    uploadData.sent += d.byteLength;
                }

                await new Promise(r => { uploadData.doneResolve = r; if (uploadData.acked >= total) r(); setTimeout(r, 60000); });
                ws.send(JSON.stringify({ done: true }));
            } catch (e) {
                coreLabel.textContent = 'failed';
                setTimeout(resetToIdle, 2000);
            }
        }

        fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); fileInput.value = ''; };
    </script>
</body>

</html>
