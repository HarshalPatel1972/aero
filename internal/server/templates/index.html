<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #22c55e;
            --accent-dim: rgba(34, 197, 94, 0.15);
            --accent-blue: #3b82f6;
            --accent-blue-dim: rgba(59, 130, 246, 0.15);
            --text: #fff;
            --text-dim: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .ambient {
            position: fixed;
            width: 500px;
            height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--accent-dim), transparent 70%);
            filter: blur(60px);
            opacity: 0.5;
            animation: breathe 6s ease-in-out infinite;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .ambient.receive {
            background: radial-gradient(circle, var(--accent-blue-dim), transparent 70%);
        }

        @keyframes breathe {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.6;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 48px;
        }

        .logo-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 1px;
            vertical-align: super;
            animation: pulse 2s ease-in-out infinite;
            transition: background 0.3s ease;
        }

        .logo-dot.receive {
            background: var(--accent-blue);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* Orb */
        .orb-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ring-1 {
            inset: 0;
        }

        .ring-2 {
            inset: 20px;
        }

        .ring-3 {
            inset: 40px;
        }

        .progress-ring {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .progress-ring .track {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .progress-ring .fill {
            stroke: var(--accent);
            stroke-dasharray: 628;
            stroke-dashoffset: 628;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .progress-ring .fill.receive {
            stroke: var(--accent-blue);
            filter: drop-shadow(0 0 8px var(--accent-blue));
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
            opacity: 0;
            top: 50%;
            left: 50%;
            margin: -3px 0 0 -3px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .particle.receive {
            background: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-blue);
        }

        .orb-container.transferring .particle {
            opacity: 1;
            animation: orbit 1.5s linear infinite;
        }

        @keyframes orbit {
            from {
                transform: rotate(0deg) translateX(100px) rotate(0deg);
            }

            to {
                transform: rotate(360deg) translateX(100px) rotate(-360deg);
            }
        }

        .particle-2 {
            animation-delay: 0.5s !important;
        }

        .particle-3 {
            animation-delay: 1s !important;
        }

        .orb-center {
            position: absolute;
            inset: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .orb-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }

        .orb-text {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 300;
        }

        /* Success/Receive states */
        .orb-container.success .orb-center {
            background: var(--accent-dim);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .orb-container.receiving .orb-center {
            background: var(--accent-blue-dim);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Stats */
        .stats {
            margin-top: 32px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .stats.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stat-percent {
            font-size: 2rem;
            font-weight: 500;
            color: var(--accent);
            transition: color 0.3s ease;
        }

        .stat-percent.receive {
            color: var(--accent-blue);
        }

        .stat-speed {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 300;
        }

        .stat-file {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 12px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            position: fixed;
            bottom: 24px;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            opacity: 0.6;
        }

        input[type="file"] {
            display: none;
        }

        /* Incoming file notification */
        .incoming {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .incoming.visible {
            display: flex;
        }

        .incoming-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .incoming-file {
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 24px;
        }

        .incoming-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="ambient" id="ambient"></div>

    <div class="container">
        <h1 class="logo">aero<span class="logo-dot" id="logoDot"></span></h1>

        <div class="orb-container" id="orb">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>

            <svg class="progress-ring" viewBox="0 0 200 200">
                <circle class="track" cx="100" cy="100" r="99" />
                <circle class="fill" id="progressCircle" cx="100" cy="100" r="99" />
            </svg>

            <div class="particle" id="p1"></div>
            <div class="particle particle-2" id="p2"></div>
            <div class="particle particle-3" id="p3"></div>

            <div class="orb-center">
                <div class="orb-icon" id="orbIcon">↑</div>
                <div class="orb-text" id="orbText">tap to send</div>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-percent" id="statPercent">0%</div>
            <div class="stat-speed" id="statSpeed">—</div>
            <div class="stat-file" id="statFile">—</div>
        </div>
    </div>

    <div class="footer">LOCAL • PRIVATE • BIDIRECTIONAL</div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        (function () {
            const $ = id => document.getElementById(id);
            const orb = $('orb'), fileInput = $('fileInput');
            const orbIcon = $('orbIcon'), orbText = $('orbText');
            const stats = $('stats'), statPercent = $('statPercent'), statSpeed = $('statSpeed'), statFile = $('statFile');
            const progressCircle = $('progressCircle');
            const ambient = $('ambient'), logoDot = $('logoDot');
            const p1 = $('p1'), p2 = $('p2'), p3 = $('p3');
            const circumference = 2 * Math.PI * 99;

            progressCircle.style.strokeDasharray = circumference;
            progressCircle.style.strokeDashoffset = circumference;

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const setProgress = pct => {
                progressCircle.style.strokeDashoffset = circumference - (pct / 100) * circumference;
            };

            const setMode = mode => {
                const isReceive = mode === 'receive';
                ambient.classList.toggle('receive', isReceive);
                logoDot.classList.toggle('receive', isReceive);
                progressCircle.classList.toggle('receive', isReceive);
                statPercent.classList.toggle('receive', isReceive);
                [p1, p2, p3].forEach(p => p.classList.toggle('receive', isReceive));
            };

            let ws = null;
            let receiveChunks = [];
            let receiveMeta = null;

            const connect = () => {
                ws = new WebSocket(`ws://${location.host}/transfer`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    console.log('Connected to AERO');
                };

                ws.onmessage = e => {
                    if (typeof e.data === 'string') {
                        try {
                            const msg = JSON.parse(e.data);

                            // Incoming file from PC
                            if (msg.type === 'file_incoming') {
                                receiveMeta = { name: msg.name, size: msg.size, chunks: msg.chunks };
                                receiveChunks = new Array(msg.chunks);
                                setMode('receive');
                                orb.classList.add('transferring', 'receiving');
                                orb.classList.remove('success');
                                stats.classList.add('visible');
                                orbIcon.textContent = '↓';
                                orbText.textContent = 'receiving';
                                statFile.textContent = msg.name;
                                statPercent.textContent = '0%';
                                statSpeed.textContent = 'from PC...';
                                setProgress(0);
                            }

                            // File complete from PC
                            if (msg.type === 'file_complete') {
                                // Assemble and download
                                const blob = new Blob(receiveChunks);
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = receiveMeta.name;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);

                                setProgress(100);
                                statPercent.textContent = '100%';
                                orb.classList.remove('transferring', 'receiving');
                                orb.classList.add('success');
                                orbIcon.textContent = '✓';
                                orbText.textContent = 'downloaded';
                                statSpeed.textContent = 'saved to device';

                                // Reset after delay
                                setTimeout(() => {
                                    setMode('send');
                                    orb.classList.remove('success');
                                    orbIcon.textContent = '↑';
                                    orbText.textContent = 'tap to send';
                                    stats.classList.remove('visible');
                                    receiveChunks = [];
                                    receiveMeta = null;
                                }, 3000);
                            }
                        } catch { }
                    } else if (e.data instanceof ArrayBuffer) {
                        // Receiving chunk from PC
                        if (receiveMeta) {
                            const view = new DataView(e.data);
                            const idx = view.getUint32(0, true);
                            const data = new Uint8Array(e.data, 4);
                            receiveChunks[idx] = data;

                            const received = receiveChunks.filter(c => c).length;
                            const pct = (received / receiveMeta.chunks) * 100;
                            setProgress(Math.min(99, pct));
                            statPercent.textContent = Math.round(pct) + '%';

                            // Send ACK
                            ws.send(JSON.stringify({ ack: idx }));
                        }
                    }
                };

                ws.onclose = () => {
                    console.log('Disconnected, reconnecting...');
                    setTimeout(connect, 2000);
                };
            };

            connect();
            orb.onclick = () => fileInput.click();

            async function upload(file) {
                const t0 = Date.now();
                const CHUNK = 1024 * 1024;
                const total = Math.ceil(file.size / CHUNK);
                let acked = 0, sent = 0;

                setMode('send');
                orb.classList.add('transferring');
                orb.classList.remove('success', 'receiving');
                stats.classList.add('visible');
                orbIcon.textContent = '↑';
                orbText.textContent = 'sending';
                statFile.textContent = file.name;
                statPercent.textContent = '0%';
                statSpeed.textContent = 'connecting...';
                setProgress(0);

                try {
                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));

                    await new Promise(r => {
                        const handler = e => {
                            if (JSON.parse(e.data).status === 'ready') {
                                ws.removeEventListener('message', handler);
                                r();
                            }
                        };
                        ws.addEventListener('message', handler);
                    });

                    statSpeed.textContent = 'transferring...';

                    let done;
                    const ackHandler = e => {
                        try {
                            const m = JSON.parse(e.data);
                            if (typeof m.ack === 'number') {
                                acked++;
                                const p = Math.min(99, (acked / total) * 100);
                                const s = sent / ((Date.now() - t0) / 1000);
                                setProgress(p);
                                statPercent.textContent = Math.round(p) + '%';
                                statSpeed.textContent = fmt(s) + '/s';
                                if (done && acked >= total) done();
                            } else if (m.status && done) done(m);
                        } catch { }
                    };
                    ws.addEventListener('message', ackHandler);

                    for (let i = 0; i < total; i++) {
                        const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                        const h = new ArrayBuffer(4); new DataView(h).setUint32(0, i, true);
                        const c = new Uint8Array(4 + d.byteLength);
                        c.set(new Uint8Array(h), 0); c.set(new Uint8Array(d), 4);
                        ws.send(c); sent += d.byteLength;
                    }

                    statSpeed.textContent = 'verifying...';
                    await new Promise(r => { done = r; if (acked >= total) r(); setTimeout(r, 60000); });

                    ws.send(JSON.stringify({ done: true }));
                    await new Promise(r => {
                        const h = e => {
                            try { if (JSON.parse(e.data).status) { ws.removeEventListener('message', h); r(); } } catch { }
                        };
                        ws.addEventListener('message', h);
                        setTimeout(r, 30000);
                    });

                    ws.removeEventListener('message', ackHandler);

                    setProgress(100);
                    statPercent.textContent = '100%';
                    orb.classList.remove('transferring');
                    orb.classList.add('success');
                    orbIcon.textContent = '✓';
                    orbText.textContent = 'complete';
                    const sec = ((Date.now() - t0) / 1000).toFixed(1);
                    statSpeed.textContent = sec + 's • ' + fmt(file.size / sec) + '/s';

                } catch (e) {
                    orb.classList.remove('transferring');
                    orbIcon.textContent = '✗';
                    orbText.textContent = 'failed';
                    statSpeed.textContent = e.message;
                }
            }

            fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };
        })();
    </script>
</body>

</html>
