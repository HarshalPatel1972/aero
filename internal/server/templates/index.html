<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #22c55e;
            --accent-dim: rgba(34, 197, 94, 0.12);
            --accent-blue: #3b82f6;
            --accent-blue-dim: rgba(59, 130, 246, 0.12);
            --text: #fff;
            --text-dim: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Animated mesh gradient background */
        .mesh-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            animation: meshMove 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes meshMove {

            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            25% {
                transform: scale(1.05) translate(10px, -10px);
            }

            50% {
                transform: scale(1) translate(-5px, 5px);
            }

            75% {
                transform: scale(1.02) translate(5px, 10px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
        }

        /* SACRED LOGO - NEVER CHANGE */
        .logo {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 40px;
        }

        .logo-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 1px;
            vertical-align: super;
            animation: pulse 2s ease-in-out infinite;
            transition: background 0.3s ease;
        }

        .logo-dot.receive {
            background: var(--accent-blue);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* THE PORTAL - Unique morphing shape */
        .portal {
            position: relative;
            width: 180px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .portal:hover {
            transform: scale(1.03);
        }

        .portal:active {
            transform: scale(0.97);
        }

        /* Morphing blob background */
        .blob {
            position: absolute;
            inset: -20px;
            background: linear-gradient(135deg, var(--accent-dim), transparent);
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            opacity: 0.5;
            animation: morph 8s ease-in-out infinite;
            transition: background 0.5s ease;
        }

        .blob.receive {
            background: linear-gradient(135deg, var(--accent-blue-dim), transparent);
        }

        @keyframes morph {

            0%,
            100% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }

            25% {
                border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
            }

            50% {
                border-radius: 50% 60% 30% 60% / 30% 40% 70% 50%;
            }

            75% {
                border-radius: 40% 30% 60% 50% / 60% 70% 30% 40%;
            }
        }

        /* Outer ring with gradient stroke */
        .outer-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent), transparent, var(--accent));
            opacity: 0;
            animation: none;
            transition: opacity 0.5s ease;
        }

        .outer-ring::before {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--bg);
        }

        .portal.active .outer-ring {
            opacity: 0.6;
            animation: spinGlow 2s linear infinite;
        }

        @keyframes spinGlow {
            to {
                transform: rotate(360deg);
            }
        }

        /* Progress ring */
        .progress-ring {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .progress-ring .track {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .progress-ring .fill {
            stroke: var(--accent);
            stroke-dasharray: 565;
            stroke-dashoffset: 565;
            transition: stroke-dashoffset 0.2s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 6px var(--accent));
        }

        .progress-ring .fill.receive {
            stroke: var(--accent-blue);
            filter: drop-shadow(0 0 6px var(--accent-blue));
        }

        /* Floating particles */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            transition: background 0.3s ease;
        }

        .dot.receive {
            background: var(--accent-blue);
        }

        .portal.active .dot {
            opacity: 1;
        }

        .dot:nth-child(1) {
            top: 10%;
            left: 50%;
            animation: float1 3s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            top: 50%;
            left: 95%;
            animation: float2 2.5s ease-in-out infinite 0.5s;
        }

        .dot:nth-child(3) {
            top: 90%;
            left: 50%;
            animation: float3 2.8s ease-in-out infinite 1s;
        }

        .dot:nth-child(4) {
            top: 50%;
            left: 5%;
            animation: float4 3.2s ease-in-out infinite 0.3s;
        }

        @keyframes float1 {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(10px);
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-10px);
            }
        }

        @keyframes float3 {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes float4 {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(10px);
            }
        }

        /* Inner core */
        .core {
            position: absolute;
            inset: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }

        .portal:hover .core {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .portal.success .core {
            background: var(--accent-dim);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .core-icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .core-text {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Stats */
        .stats {
            margin-top: 28px;
            text-align: center;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.4s ease;
        }

        .stats.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stat-percent {
            font-size: 2.2rem;
            font-weight: 500;
            color: var(--accent);
            transition: color 0.3s ease;
        }

        .stat-percent.receive {
            color: var(--accent-blue);
        }

        .stat-speed {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .stat-file {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 8px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Recents section */
        .recents {
            width: 100%;
            margin-top: 32px;
        }

        .recents-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .recents-header span {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .recents-header::before,
        .recents-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin-bottom: 6px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .recent-icon {
            font-size: 1rem;
        }

        .recent-info {
            flex: 1;
            min-width: 0;
        }

        .recent-name {
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-meta {
            font-size: 0.6rem;
            color: var(--text-dim);
        }

        .recent-status {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .recent-status.sent {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .recent-status.received {
            background: var(--accent-blue-dim);
            color: var(--accent-blue);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="mesh-bg"></div>

    <div class="container">
        <h1 class="logo">aero<span class="logo-dot" id="logoDot"></span></h1>

        <div class="portal" id="portal">
            <div class="blob" id="blob"></div>
            <div class="outer-ring"></div>

            <svg class="progress-ring" viewBox="0 0 180 180">
                <circle class="track" cx="90" cy="90" r="89" />
                <circle class="fill" id="progressCircle" cx="90" cy="90" r="89" />
            </svg>

            <div class="particles">
                <div class="dot" id="d1"></div>
                <div class="dot" id="d2"></div>
                <div class="dot" id="d3"></div>
                <div class="dot" id="d4"></div>
            </div>

            <div class="core">
                <div class="core-icon" id="coreIcon">↑</div>
                <div class="core-text" id="coreText">tap to send</div>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-percent" id="statPercent">0%</div>
            <div class="stat-speed" id="statSpeed">—</div>
            <div class="stat-file" id="statFile">—</div>
        </div>

        <div class="recents" id="recents"></div>
    </div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        (function () {
            const $ = id => document.getElementById(id);
            const portal = $('portal'), fileInput = $('fileInput');
            const coreIcon = $('coreIcon'), coreText = $('coreText');
            const stats = $('stats'), statPercent = $('statPercent'), statSpeed = $('statSpeed'), statFile = $('statFile');
            const progressCircle = $('progressCircle');
            const logoDot = $('logoDot'), blob = $('blob');
            const d1 = $('d1'), d2 = $('d2'), d3 = $('d3'), d4 = $('d4');
            const recentsDiv = $('recents');
            const circumference = 2 * Math.PI * 89;

            progressCircle.style.strokeDasharray = circumference;
            progressCircle.style.strokeDashoffset = circumference;

            const recentHistory = [];
            const MAX_RECENTS = 5;

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const setProgress = pct => {
                progressCircle.style.strokeDashoffset = circumference - (pct / 100) * circumference;
            };

            const setMode = mode => {
                const isReceive = mode === 'receive';
                logoDot.classList.toggle('receive', isReceive);
                blob.classList.toggle('receive', isReceive);
                progressCircle.classList.toggle('receive', isReceive);
                statPercent.classList.toggle('receive', isReceive);
                [d1, d2, d3, d4].forEach(d => d.classList.toggle('receive', isReceive));
            };

            const addRecent = (name, size, type) => {
                recentHistory.unshift({ name, size, type, time: new Date() });
                if (recentHistory.length > MAX_RECENTS) recentHistory.pop();
                renderRecents();
            };

            const renderRecents = () => {
                if (recentHistory.length === 0) {
                    recentsDiv.innerHTML = '';
                    return;
                }
                recentsDiv.innerHTML = `
                <div class="recents-header"><span>Recent</span></div>
                ${recentHistory.map(r => `
                    <div class="recent-item">
                        <div class="recent-icon">${r.type === 'sent' ? '↑' : '↓'}</div>
                        <div class="recent-info">
                            <div class="recent-name">${r.name}</div>
                            <div class="recent-meta">${fmt(r.size)}</div>
                        </div>
                        <div class="recent-status ${r.type}">${r.type}</div>
                    </div>
                `).join('')}
            `;
            };

            const resetToIdle = () => {
                setMode('send');
                portal.classList.remove('success', 'active');
                coreIcon.textContent = '↑';
                coreText.textContent = 'tap to send';
                stats.classList.remove('visible');
                setProgress(0);
            };

            let ws = null;
            let receiveChunks = [];
            let receiveMeta = null;

            const connect = () => {
                ws = new WebSocket(`ws://${location.host}/transfer`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => console.log('Connected');

                ws.onmessage = e => {
                    if (typeof e.data === 'string') {
                        try {
                            const msg = JSON.parse(e.data);
                            console.log('Received:', msg);

                            // Incoming file from PC
                            if (msg.type === 'file_incoming') {
                                receiveMeta = { name: msg.name, size: msg.size, chunks: msg.chunks };
                                receiveChunks = new Array(msg.chunks);
                                setMode('receive');
                                portal.classList.add('active');
                                portal.classList.remove('success');
                                stats.classList.add('visible');
                                coreIcon.textContent = '↓';
                                coreText.textContent = 'receiving';
                                statFile.textContent = msg.name;
                                statPercent.textContent = '0%';
                                statSpeed.textContent = 'from PC...';
                                setProgress(0);
                            }

                            // File complete from PC
                            if (msg.type === 'file_complete') {
                                const blob = new Blob(receiveChunks);
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = receiveMeta.name;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);

                                setProgress(100);
                                statPercent.textContent = '100%';
                                portal.classList.remove('active');
                                portal.classList.add('success');
                                coreIcon.textContent = '✓';
                                coreText.textContent = 'saved';
                                statSpeed.textContent = 'downloaded';

                                addRecent(receiveMeta.name, receiveMeta.size, 'received');
                                setTimeout(resetToIdle, 2500);
                                receiveChunks = [];
                                receiveMeta = null;
                            }
                        } catch (err) { console.error('Parse error:', err); }
                    } else if (e.data instanceof ArrayBuffer) {
                        // Receiving chunk from PC
                        if (receiveMeta) {
                            const view = new DataView(e.data);
                            const idx = view.getUint32(0, true);
                            const data = new Uint8Array(e.data, 4);
                            receiveChunks[idx] = data;

                            const received = receiveChunks.filter(c => c).length;
                            const pct = (received / receiveMeta.chunks) * 100;
                            setProgress(Math.min(99, pct));
                            statPercent.textContent = Math.round(pct) + '%';

                            ws.send(JSON.stringify({ ack: idx }));
                        }
                    }
                };

                ws.onclose = () => {
                    console.log('Disconnected, reconnecting...');
                    setTimeout(connect, 2000);
                };

                ws.onerror = e => console.error('WS error:', e);
            };

            connect();
            portal.onclick = () => fileInput.click();

            async function upload(file) {
                const t0 = Date.now();
                const CHUNK = 1024 * 1024;
                const total = Math.ceil(file.size / CHUNK);
                let acked = 0, sent = 0;

                setMode('send');
                portal.classList.add('active');
                portal.classList.remove('success');
                stats.classList.add('visible');
                coreIcon.textContent = '↑';
                coreText.textContent = 'sending';
                statFile.textContent = file.name;
                statPercent.textContent = '0%';
                statSpeed.textContent = 'connecting...';
                setProgress(0);

                try {
                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));

                    await new Promise(r => {
                        const handler = e => {
                            try { if (JSON.parse(e.data).status === 'ready') { ws.removeEventListener('message', handler); r(); } } catch { }
                        };
                        ws.addEventListener('message', handler);
                    });

                    statSpeed.textContent = 'transferring...';

                    let done;
                    const ackHandler = e => {
                        try {
                            const m = JSON.parse(e.data);
                            if (typeof m.ack === 'number') {
                                acked++;
                                const p = Math.min(99, (acked / total) * 100);
                                const s = sent / ((Date.now() - t0) / 1000);
                                setProgress(p);
                                statPercent.textContent = Math.round(p) + '%';
                                statSpeed.textContent = fmt(s) + '/s';
                                if (done && acked >= total) done();
                            } else if (m.status && done) done(m);
                        } catch { }
                    };
                    ws.addEventListener('message', ackHandler);

                    for (let i = 0; i < total; i++) {
                        const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                        const h = new ArrayBuffer(4); new DataView(h).setUint32(0, i, true);
                        const c = new Uint8Array(4 + d.byteLength);
                        c.set(new Uint8Array(h), 0); c.set(new Uint8Array(d), 4);
                        ws.send(c); sent += d.byteLength;
                    }

                    statSpeed.textContent = 'verifying...';
                    await new Promise(r => { done = r; if (acked >= total) r(); setTimeout(r, 60000); });

                    ws.send(JSON.stringify({ done: true }));
                    await new Promise(r => {
                        const h = e => { try { if (JSON.parse(e.data).status) { ws.removeEventListener('message', h); r(); } } catch { } };
                        ws.addEventListener('message', h);
                        setTimeout(r, 30000);
                    });

                    ws.removeEventListener('message', ackHandler);

                    setProgress(100);
                    statPercent.textContent = '100%';
                    portal.classList.remove('active');
                    portal.classList.add('success');
                    coreIcon.textContent = '✓';
                    coreText.textContent = 'complete';
                    const sec = ((Date.now() - t0) / 1000).toFixed(1);
                    statSpeed.textContent = sec + 's • ' + fmt(file.size / sec) + '/s';

                    addRecent(file.name, file.size, 'sent');
                    setTimeout(resetToIdle, 2500);

                } catch (e) {
                    portal.classList.remove('active');
                    coreIcon.textContent = '✗';
                    coreText.textContent = 'failed';
                    statSpeed.textContent = e.message;
                    setTimeout(resetToIdle, 3000);
                }
            }

            fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };
        })();
    </script>
</body>

</html>
