<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.4);
            --green-dim: rgba(0, 255, 136, 0.1);
            --blue: #00aaff;
            --blue-glow: rgba(0, 170, 255, 0.4);
            --blue-dim: rgba(0, 170, 255, 0.1);
            --black: #000000;
            --white: #ffffff;
            --dim: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        /* SACRED LOGO */
        .logo {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 48px;
        }

        .logo-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            margin-left: 1px;
            vertical-align: super;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px var(--green-glow);
        }

        .logo-dot.receive {
            background: var(--blue);
            box-shadow: 0 0 10px var(--blue-glow);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(0.8);
            }
        }

        /* THE ORB */
        .orb {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
        }

        .orb-glow {
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.5;
            animation: glow-pulse 3s ease-in-out infinite;
            transition: background 0.5s ease;
        }

        .orb-glow.receive {
            background: radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
        }

        @keyframes glow-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .orb-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transition: border-color 0.3s ease;
        }

        .orb:hover .orb-ring {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .progress-svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .progress-svg circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .progress-track {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            stroke: var(--green);
            stroke-dasharray: 628;
            stroke-dashoffset: 628;
            transition: stroke-dashoffset 0.2s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px var(--green));
        }

        .progress-fill.receive {
            stroke: var(--blue);
            filter: drop-shadow(0 0 8px var(--blue));
        }

        .orb-center {
            position: absolute;
            inset: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .orb:hover .orb-center {
            background: rgba(255, 255, 255, 0.04);
        }

        .orb.success .orb-center {
            background: var(--green-dim);
        }

        .orb-icon {
            font-size: 2.5rem;
            margin-bottom: 4px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .orb:hover .orb-icon {
            transform: translateY(-2px);
        }

        .orb.success .orb-icon {
            color: var(--green);
        }

        .orb.receive .orb-icon {
            color: var(--blue);
        }

        .orb-text {
            font-size: 0.7rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 400;
        }

        /* STATS */
        .stats {
            margin-top: 32px;
            text-align: center;
            height: 80px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .stats.visible {
            opacity: 1;
        }

        .stat-percent {
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--green);
            transition: color 0.3s ease;
        }

        .stat-percent.receive {
            color: var(--blue);
        }

        .stat-speed {
            font-size: 0.75rem;
            color: var(--dim);
            margin-top: 2px;
        }

        .stat-file {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 8px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* RECENTS */
        .recents {
            width: 100%;
            margin-top: 24px;
            max-height: 150px;
            overflow-y: auto;
        }

        .recent-header {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            text-align: center;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .recent-icon {
            font-size: 0.8rem;
            width: 20px;
            text-align: center;
        }

        .recent-icon.sent {
            color: var(--green);
        }

        .recent-icon.received {
            color: var(--blue);
        }

        .recent-name {
            flex: 1;
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-badge {
            font-size: 0.5rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .recent-badge.sent {
            background: var(--green-dim);
            color: var(--green);
        }

        .recent-badge.received {
            background: var(--blue-dim);
            color: var(--blue);
        }

        /* DEBUG */
        .debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="logo">aero<span class="logo-dot" id="logoDot"></span></h1>

        <div class="orb" id="orb">
            <div class="orb-glow" id="orbGlow"></div>
            <div class="orb-ring"></div>

            <svg class="progress-svg" viewBox="0 0 200 200">
                <circle class="progress-track" cx="100" cy="100" r="99" />
                <circle class="progress-fill" id="progressFill" cx="100" cy="100" r="99" />
            </svg>

            <div class="orb-center">
                <div class="orb-icon" id="orbIcon">↑</div>
                <div class="orb-text" id="orbText">tap to send</div>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-percent" id="statPercent">0%</div>
            <div class="stat-speed" id="statSpeed">—</div>
            <div class="stat-file" id="statFile">—</div>
        </div>

        <div class="recents" id="recents"></div>
    </div>

    <div class="debug" id="debug">connecting...</div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        (function () {
            const $ = id => document.getElementById(id);
            const orb = $('orb'), fileInput = $('fileInput');
            const orbIcon = $('orbIcon'), orbText = $('orbText'), orbGlow = $('orbGlow');
            const logoDot = $('logoDot'), progressFill = $('progressFill');
            const stats = $('stats'), statPercent = $('statPercent'), statSpeed = $('statSpeed'), statFile = $('statFile');
            const recentsDiv = $('recents');
            const debugDiv = $('debug');

            const circumference = 2 * Math.PI * 99;
            progressFill.style.strokeDasharray = circumference;
            progressFill.style.strokeDashoffset = circumference;

            const recents = [];
            const MAX_RECENTS = 5;

            // State machine
            const STATE = {
                IDLE: 'idle',
                UPLOADING: 'uploading',
                RECEIVING: 'receiving'
            };

            let currentState = STATE.IDLE;
            let uploadData = null;
            let receiveData = null;
            let ws = null;

            const log = (msg) => {
                console.log('[AERO]', msg);
                debugDiv.textContent = msg;
            };

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const setProgress = pct => {
                progressFill.style.strokeDashoffset = circumference - (pct / 100) * circumference;
            };

            const setReceiveMode = (on) => {
                logoDot.classList.toggle('receive', on);
                orbGlow.classList.toggle('receive', on);
                progressFill.classList.toggle('receive', on);
                statPercent.classList.toggle('receive', on);
                orb.classList.toggle('receive', on);
            };

            const addRecent = (name, type) => {
                recents.unshift({ name, type });
                if (recents.length > MAX_RECENTS) recents.pop();
                renderRecents();
            };

            const renderRecents = () => {
                if (recents.length === 0) { recentsDiv.innerHTML = ''; return; }
                recentsDiv.innerHTML = `
                <div class="recent-header">Recent</div>
                ${recents.map(r => `
                    <div class="recent-item">
                        <div class="recent-icon ${r.type}">${r.type === 'sent' ? '↑' : '↓'}</div>
                        <div class="recent-name">${r.name}</div>
                        <div class="recent-badge ${r.type}">${r.type}</div>
                    </div>
                `).join('')}
            `;
            };

            const resetToIdle = () => {
                currentState = STATE.IDLE;
                setReceiveMode(false);
                orb.classList.remove('success');
                orbIcon.textContent = '↑';
                orbText.textContent = 'tap to send';
                stats.classList.remove('visible');
                setProgress(0);
                uploadData = null;
                receiveData = null;
                log('ready');
            };

            // ═══════════════════════════════════════════
            // MESSAGE HANDLER - Routes all messages
            // ═══════════════════════════════════════════
            const handleMessage = (e) => {
                // Binary data = chunk (either upload ACK context or receive context)
                if (e.data instanceof ArrayBuffer) {
                    // Only process binary if we're RECEIVING from PC
                    if (currentState === STATE.RECEIVING && receiveData) {
                        const view = new DataView(e.data);
                        const idx = view.getUint32(0, true);
                        const chunk = new Uint8Array(e.data, 4);
                        receiveData.chunks[idx] = chunk;

                        const received = receiveData.chunks.filter(c => c).length;
                        const pct = (received / receiveData.meta.chunks) * 100;
                        setProgress(Math.min(99, pct));
                        statPercent.textContent = Math.round(pct) + '%';
                        log(`recv chunk ${idx}/${receiveData.meta.chunks}`);

                        // Send ACK back to server
                        ws.send(JSON.stringify({ ack: idx }));
                    }
                    return;
                }

                // Text = JSON
                try {
                    const msg = JSON.parse(e.data);
                    log('msg: ' + JSON.stringify(msg).substring(0, 50));

                    // === UPLOAD RELATED ===
                    if (currentState === STATE.UPLOADING && uploadData) {
                        if (msg.status === 'ready') {
                            uploadData.ready = true;
                        }
                        if (typeof msg.ack === 'number') {
                            uploadData.acked++;
                            const pct = Math.min(99, (uploadData.acked / uploadData.total) * 100);
                            setProgress(pct);
                            statPercent.textContent = Math.round(pct) + '%';
                            statSpeed.textContent = fmt(uploadData.sent / ((Date.now() - uploadData.t0) / 1000)) + '/s';

                            if (uploadData.acked >= uploadData.total && uploadData.doneResolve) {
                                uploadData.doneResolve();
                            }
                        }
                        if (msg.status === 'success') {
                            setProgress(100);
                            statPercent.textContent = '100%';
                            orb.classList.add('success');
                            orbIcon.textContent = '✓';
                            orbText.textContent = 'sent';
                            const sec = ((Date.now() - uploadData.t0) / 1000).toFixed(1);
                            statSpeed.textContent = sec + 's';
                            addRecent(uploadData.name, 'sent');
                            setTimeout(resetToIdle, 2000);
                        }
                        return; // Don't process receive messages during upload
                    }

                    // === RECEIVE RELATED (from PC) ===
                    if (msg.type === 'file_incoming') {
                        log('incoming file: ' + msg.name);
                        currentState = STATE.RECEIVING;
                        receiveData = {
                            meta: { name: msg.name, size: msg.size, chunks: msg.chunks },
                            chunks: new Array(msg.chunks)
                        };
                        setReceiveMode(true);
                        stats.classList.add('visible');
                        orbIcon.textContent = '↓';
                        orbText.textContent = 'receiving';
                        statFile.textContent = msg.name;
                        statPercent.textContent = '0%';
                        statSpeed.textContent = 'from PC';
                        setProgress(0);
                    }

                    if (msg.type === 'file_complete' && currentState === STATE.RECEIVING && receiveData) {
                        log('file complete, downloading...');
                        const blob = new Blob(receiveData.chunks);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = receiveData.meta.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        setProgress(100);
                        statPercent.textContent = '100%';
                        orb.classList.add('success');
                        orbIcon.textContent = '✓';
                        orbText.textContent = 'saved';
                        statSpeed.textContent = 'downloaded';
                        addRecent(receiveData.meta.name, 'received');
                        setTimeout(resetToIdle, 2000);
                    }

                } catch (err) {
                    log('parse error: ' + err.message);
                }
            };

            const connect = () => {
                log('connecting...');
                ws = new WebSocket(`ws://${location.host}/transfer`);
                ws.binaryType = 'arraybuffer';
                ws.onopen = () => log('connected');
                ws.onmessage = handleMessage;
                ws.onclose = () => {
                    log('disconnected, reconnecting...');
                    setTimeout(connect, 2000);
                };
                ws.onerror = (e) => log('ws error');
            };

            connect();
            orb.onclick = () => {
                if (currentState === STATE.IDLE) {
                    fileInput.click();
                }
            };

            // ═══════════════════════════════════════════
            // UPLOAD FUNCTION
            // ═══════════════════════════════════════════
            async function upload(file) {
                if (currentState !== STATE.IDLE) {
                    log('busy, cannot upload');
                    return;
                }

                currentState = STATE.UPLOADING;
                const CHUNK = 1024 * 1024;
                const total = Math.ceil(file.size / CHUNK);

                uploadData = {
                    name: file.name,
                    total,
                    acked: 0,
                    sent: 0,
                    t0: Date.now(),
                    ready: false,
                    doneResolve: null
                };

                setReceiveMode(false);
                orb.classList.remove('success');
                stats.classList.add('visible');
                orbIcon.textContent = '↑';
                orbText.textContent = 'sending';
                statFile.textContent = file.name;
                statPercent.textContent = '0%';
                statSpeed.textContent = 'connecting...';
                setProgress(0);
                log('starting upload: ' + file.name);

                try {
                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));

                    // Wait for ready
                    await new Promise((resolve, reject) => {
                        const check = () => {
                            if (uploadData.ready) resolve();
                            else setTimeout(check, 10);
                        };
                        check();
                        setTimeout(() => reject(new Error('timeout')), 10000);
                    });

                    log('server ready, sending chunks...');
                    statSpeed.textContent = 'transferring...';

                    // Send all chunks
                    for (let i = 0; i < total; i++) {
                        const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                        const h = new ArrayBuffer(4);
                        new DataView(h).setUint32(0, i, true);
                        const c = new Uint8Array(4 + d.byteLength);
                        c.set(new Uint8Array(h), 0);
                        c.set(new Uint8Array(d), 4);
                        ws.send(c);
                        uploadData.sent += d.byteLength;
                    }

                    log('all chunks sent, waiting for ACKs...');
                    statSpeed.textContent = 'verifying...';

                    await new Promise((resolve) => {
                        uploadData.doneResolve = resolve;
                        if (uploadData.acked >= total) resolve();
                        setTimeout(resolve, 60000);
                    });

                    log('sending done signal');
                    ws.send(JSON.stringify({ done: true }));

                } catch (e) {
                    log('upload error: ' + e.message);
                    orbIcon.textContent = '✗';
                    orbText.textContent = 'failed';
                    statSpeed.textContent = e.message;
                    setTimeout(resetToIdle, 3000);
                }
            }

            fileInput.onchange = () => {
                if (fileInput.files[0]) upload(fileInput.files[0]);
                fileInput.value = ''; // Reset so same file can be selected again
            };
        })();
    </script>
</body>

</html>
