<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AERO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .logo span {
            background: linear-gradient(135deg, var(--accent), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Drop Zone */
        .drop-zone {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            pointer-events: none;
        }

        .drop-zone:hover {
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .drop-zone.active {
            pointer-events: none;
        }

        .drop-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: var(--surface-hover);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .drop-icon {
            transform: scale(1.05);
        }

        .drop-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .drop-subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        input[type="file"] {
            display: none;
        }

        /* Progress Section */
        .progress-section {
            display: none;
            margin-top: 24px;
        }

        .progress-section.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .file-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-glow), transparent);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Progress Bar */
        .progress-bar-container {
            margin-top: 16px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #34d399);
            width: 0%;
            transition: width 0.15s ease;
            border-radius: 2px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3));
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.75rem;
        }

        .progress-percent {
            font-weight: 500;
            color: var(--accent);
        }

        .progress-speed {
            color: var(--text-dim);
        }

        /* Status */
        .status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
        }

        .status.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .status.success {
            background: var(--accent-glow);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .status-text {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status.success .status-text {
            color: var(--accent);
        }

        .status.error .status-text {
            color: var(--error);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .container {
                padding: 0;
            }

            .drop-zone {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">AE<span>RO</span></h1>
            <p class="tagline">Secure Local Transfer</p>
        </header>

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">📄</div>
            <div class="drop-title">Drop your file</div>
            <div class="drop-subtitle">or tap to browse</div>
        </div>
        <input type="file" id="fileInput" accept="*/*">

        <div class="progress-section" id="progressSection">
            <div class="file-card">
                <div class="file-icon">📎</div>
                <div class="file-info">
                    <div class="file-name" id="fileName">—</div>
                    <div class="file-size" id="fileSize">—</div>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-stats">
                    <span class="progress-percent" id="progressPercent">0%</span>
                    <span class="progress-speed" id="progressSpeed">Preparing...</span>
                </div>
            </div>
        </div>

        <div class="status" id="statusBox">
            <div class="status-icon" id="statusIcon"></div>
            <div class="status-text" id="statusText"></div>
        </div>

        <div class="footer">
            End-to-end • No cloud • Your network only
        </div>
    </div>

    <script>
        (function () {
            'use strict';
            const $ = id => document.getElementById(id);
            const dropZone = $('dropZone');
            const fileInput = $('fileInput');
            const progressSection = $('progressSection');
            const progressFill = $('progressFill');
            const progressPercent = $('progressPercent');
            const progressSpeed = $('progressSpeed');
            const fileName = $('fileName');
            const fileSize = $('fileSize');
            const statusBox = $('statusBox');
            const statusIcon = $('statusIcon');
            const statusText = $('statusText');

            const CHUNK_SIZE = 1024 * 1024;

            function formatBytes(b) {
                if (b === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(b) / Math.log(k));
                return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

            function showStatus(type, icon, text) {
                statusBox.className = 'status visible ' + type;
                statusIcon.textContent = icon;
                statusText.textContent = text;
            }

            async function upload(file) {
                const t0 = Date.now();
                dropZone.classList.add('active');
                progressSection.classList.add('visible');
                statusBox.classList.remove('visible');

                fileName.textContent = file.name;
                fileSize.textContent = formatBytes(file.size);
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
                progressSpeed.textContent = 'Connecting...';

                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                let ackedCount = 0;
                let bytesSent = 0;

                try {
                    const ws = new WebSocket(`ws://${location.host}/transfer`);
                    ws.binaryType = 'arraybuffer';

                    await new Promise((resolve, reject) => {
                        ws.onopen = resolve;
                        ws.onerror = () => reject(new Error('Connection failed'));
                    });

                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: totalChunks }));

                    await new Promise(resolve => {
                        ws.onmessage = e => {
                            if (JSON.parse(e.data).status === 'ready') resolve();
                        };
                    });

                    progressSpeed.textContent = 'Transferring...';

                    let ackResolve = null;
                    ws.onmessage = e => {
                        try {
                            const msg = JSON.parse(e.data);
                            if (typeof msg.ack === 'number') {
                                ackedCount++;
                                const progress = (ackedCount / totalChunks) * 100;
                                const elapsed = (Date.now() - t0) / 1000;
                                progressFill.style.width = Math.min(99, progress) + '%';
                                progressPercent.textContent = Math.round(progress) + '%';
                                progressSpeed.textContent = formatBytes(bytesSent / elapsed) + '/s';
                                if (ackResolve && ackedCount >= totalChunks) ackResolve();
                            } else if (msg.status && ackResolve) {
                                ackResolve(msg);
                            }
                        } catch { }
                    };

                    for (let i = 0; i < totalChunks; i++) {
                        const start = i * CHUNK_SIZE;
                        const end = Math.min(start + CHUNK_SIZE, file.size);
                        const data = await file.slice(start, end).arrayBuffer();
                        const header = new ArrayBuffer(4);
                        new DataView(header).setUint32(0, i, true);
                        const combined = new Uint8Array(4 + data.byteLength);
                        combined.set(new Uint8Array(header), 0);
                        combined.set(new Uint8Array(data), 4);
                        ws.send(combined);
                        bytesSent += data.byteLength;
                    }

                    progressSpeed.textContent = 'Verifying...';
                    await new Promise(resolve => {
                        ackResolve = resolve;
                        if (ackedCount >= totalChunks) resolve();
                        setTimeout(resolve, 60000);
                    });

                    progressSpeed.textContent = 'Completing...';
                    ws.send(JSON.stringify({ done: true }));

                    await new Promise(resolve => {
                        ws.onmessage = e => resolve();
                        setTimeout(resolve, 30000);
                    });

                    ws.close();

                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
                    showStatus('success', '✓', `Complete • ${elapsed}s • ${formatBytes(file.size / elapsed)}/s`);

                } catch (e) {
                    console.error(e);
                    showStatus('error', '✗', e.message);
                } finally {
                    dropZone.classList.remove('active');
                }
            }

            dropZone.onclick = () => fileInput.click();
            dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
            dropZone.ondragleave = () => dropZone.classList.remove('dragover');
            dropZone.ondrop = e => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
            };
            fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };
        })();
    </script>
</body>

</html>
