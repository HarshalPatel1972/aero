<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>Aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050505;
            --bg-surface: rgba(26, 26, 26, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --cyan: #00E5FF;
            --cyan-glow: rgba(0, 229, 255, 0.3);
            --text: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-void);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            padding-top: env(safe-area-inset-top, 16px);
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* Title Bar */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--cyan), #00B8D4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #000;
        }

        .logo-text {
            font-weight: 600;
            font-size: 15px;
        }

        .connection-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--cyan);
        }

        .connection-dot {
            width: 6px;
            height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        /* Action Button */
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover,
        .action-btn:active {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Transfer Panel */
        .transfer-panel {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: none;
        }

        .transfer-panel.active {
            display: block;
        }

        .transfer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .transfer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transfer-icon {
            width: 32px;
            height: 32px;
            background: rgba(0, 229, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transfer-icon svg {
            width: 16px;
            height: 16px;
            color: var(--cyan);
        }

        .transfer-name {
            font-size: 13px;
            font-weight: 600;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transfer-status {
            font-size: 11px;
            color: var(--text-muted);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--cyan);
            text-transform: uppercase;
        }

        .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), #00B8D4);
            border-radius: 3px;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: space-between;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value.highlight {
            color: var(--cyan);
        }

        /* Recent Files */
        .recents {
            width: 100%;
            max-width: 320px;
        }

        .recents-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-align: center;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recent-icon {
            width: 28px;
            height: 28px;
            background: rgba(0, 229, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .recent-name {
            flex: 1;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-badge {
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
            background: rgba(0, 229, 255, 0.1);
            color: var(--cyan);
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            color: var(--text-muted);
            font-size: 11px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="logo">
                <div class="logo-icon">A</div>
                <span class="logo-text">Aero</span>
            </div>
            <div class="connection-badge">
                <div class="connection-dot"></div>
                Connected
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h1 class="main-title" id="mainTitle">Send Files to PC</h1>

            <!-- Action Button -->
            <button class="action-btn" id="selectBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                Select Files
            </button>

            <!-- Transfer Panel -->
            <div class="transfer-panel" id="transferPanel">
                <div class="transfer-header">
                    <div class="transfer-info">
                        <div class="transfer-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </div>
                        <div>
                            <div class="transfer-name" id="fileName">file.zip</div>
                            <div class="transfer-status" id="transferStatus">Sending...</div>
                        </div>
                    </div>
                    <div class="live-badge">Live</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-label">Speed</div>
                        <div class="stat-value highlight" id="speedStat">0 MB/s</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Progress</div>
                        <div class="stat-value" id="progressStat">0%</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">ETA</div>
                        <div class="stat-value" id="etaStat">--</div>
                    </div>
                </div>
            </div>

            <!-- Recent Files -->
            <div class="recents" id="recents"></div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <span>Connected to PC</span>
        </div>
    </div>

    <input type="file" id="fileInput" multiple>

    <script>
        /**
         * AERO Mobile Client
         * Matching desktop aesthetic with glassmorphism design
         */
        (function () {
            'use strict';

            const MAX_CHUNK_SIZE = 10 * 1024 * 1024;
            const IV_SIZE = 16;

            // DOM
            const selectBtn = document.getElementById('selectBtn');
            const fileInput = document.getElementById('fileInput');
            const transferPanel = document.getElementById('transferPanel');
            const fileName = document.getElementById('fileName');
            const transferStatus = document.getElementById('transferStatus');
            const progressFill = document.getElementById('progressFill');
            const speedStat = document.getElementById('speedStat');
            const progressStat = document.getElementById('progressStat');
            const etaStat = document.getElementById('etaStat');
            const recentsDiv = document.getElementById('recents');
            const mainTitle = document.getElementById('mainTitle');

            // State
            let recentFiles = [];
            let cryptoKey = null;
            let encryptionEnabled = false;
            let sessionIV = null;

            // Crypto functions
            function extractKeyFromHash() {
                const hash = window.location.hash;
                if (!hash || !hash.includes('key=')) return null;
                const keyMatch = hash.match(/key=([A-Za-z0-9_-]+)/);
                return keyMatch ? keyMatch[1] : null;
            }

            async function importKey(base64Key) {
                try {
                    const keyStr = base64Key.replace(/-/g, '+').replace(/_/g, '/');
                    const keyBytes = Uint8Array.from(atob(keyStr), c => c.charCodeAt(0));
                    if (keyBytes.length !== 32) throw new Error('Invalid key size');
                    cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CTR' }, false, ['encrypt']);
                    sessionIV = crypto.getRandomValues(new Uint8Array(IV_SIZE));
                    encryptionEnabled = true;
                    console.log('[CRYPTO] ✅ Encryption enabled');
                    return true;
                } catch (e) {
                    console.error('[CRYPTO] ❌ Key import failed:', e);
                    return false;
                }
            }

            async function encryptChunk(buffer, chunkIndex) {
                if (!encryptionEnabled) return buffer;
                const counter = new Uint8Array(sessionIV);
                const view = new DataView(counter.buffer);
                const offset = chunkIndex * Math.ceil(MAX_CHUNK_SIZE / 16);
                view.setBigUint64(8, BigInt(offset), false);
                return await crypto.subtle.encrypt({ name: 'AES-CTR', counter, length: 64 }, cryptoKey, buffer);
            }

            // Init crypto
            (async () => {
                const key = extractKeyFromHash();
                if (key) await importKey(key);
            })();

            // File selection
            selectBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                for (const file of files) {
                    await uploadFile(file);
                }
                fileInput.value = '';
            });

            // Upload file
            async function uploadFile(file) {
                mainTitle.textContent = 'Sending...';
                fileName.textContent = file.name;
                transferStatus.textContent = 'Uploading...';
                transferPanel.classList.add('active');
                selectBtn.style.display = 'none';

                const totalSize = file.size;
                let uploaded = 0;
                let startTime = Date.now();
                let lastTime = startTime;
                let lastBytes = 0;

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/upload', true);

                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            uploaded = e.loaded;
                            const progress = Math.round((uploaded / totalSize) * 100);
                            progressFill.style.width = progress + '%';
                            progressStat.textContent = progress + '%';

                            const now = Date.now();
                            const timeDiff = (now - lastTime) / 1000;
                            if (timeDiff >= 0.5) {
                                const bytesDiff = uploaded - lastBytes;
                                const speed = bytesDiff / timeDiff;
                                speedStat.textContent = formatSpeed(speed);

                                const remaining = totalSize - uploaded;
                                const eta = speed > 0 ? remaining / speed : 0;
                                etaStat.textContent = formatEta(eta);

                                lastTime = now;
                                lastBytes = uploaded;
                            }
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            transferComplete(file.name, true);
                        } else {
                            transferComplete(file.name, false);
                        }
                    };

                    xhr.onerror = () => transferComplete(file.name, false);
                    xhr.send(formData);

                } catch (error) {
                    console.error('Upload failed:', error);
                    transferComplete(file.name, false);
                }
            }

            function transferComplete(name, success) {
                mainTitle.textContent = success ? 'Transfer Complete!' : 'Transfer Failed';
                transferStatus.textContent = success ? 'Sent successfully' : 'Error occurred';
                progressFill.style.width = '100%';
                progressStat.textContent = '100%';

                if (success) {
                    addRecentFile(name, 'sent');
                }

                setTimeout(() => {
                    transferPanel.classList.remove('active');
                    selectBtn.style.display = 'flex';
                    mainTitle.textContent = 'Send Files to PC';
                    progressFill.style.width = '0%';
                }, 2000);
            }

            function addRecentFile(name, type) {
                recentFiles.unshift({ name, type, time: Date.now() });
                if (recentFiles.length > 3) recentFiles.pop();
                renderRecents();
            }

            function renderRecents() {
                if (recentFiles.length === 0) {
                    recentsDiv.innerHTML = '';
                    return;
                }

                let html = '<div class="recents-header">Recent Transfers</div>';
                recentFiles.forEach(f => {
                    const icon = f.type === 'sent' ? '↑' : '↓';
                    html += `
                        <div class="recent-item">
                            <div class="recent-icon">${icon}</div>
                            <div class="recent-name">${f.name}</div>
                            <div class="recent-badge">${f.type}</div>
                        </div>
                    `;
                });
                recentsDiv.innerHTML = html;
            }

            function formatSpeed(bytesPerSec) {
                if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
                if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
                return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
            }

            function formatEta(seconds) {
                if (!seconds || seconds === Infinity) return '--';
                if (seconds < 60) return Math.ceil(seconds) + 's';
                const mins = Math.floor(seconds / 60);
                const secs = Math.ceil(seconds % 60);
                return mins + 'm ' + secs + 's';
            }

            // Haptics
            const haptics = {
                tick: () => navigator.vibrate?.(5),
                success: () => navigator.vibrate?.([50, 30, 50]),
                error: () => navigator.vibrate?.([300]),
            };
        })();
    </script>
</body>

</html>
