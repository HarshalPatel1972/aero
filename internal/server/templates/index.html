<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
            user-select: none;
        }

        #vfx {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
            pointer-events: none;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }

        .filename {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            max-width: 80%;
            word-break: break-word;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .filename.visible {
            opacity: 1;
        }

        .progress-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.08);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .progress-number.visible {
            opacity: 1;
        }

        .hint {
            position: absolute;
            bottom: 140px;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            pointer-events: all;
            cursor: pointer;
        }

        .hint.hidden {
            opacity: 0;
        }

        .status {
            position: absolute;
            bottom: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status.visible {
            opacity: 1;
        }

        .recents {
            position: absolute;
            bottom: 24px;
            width: calc(100% - 48px);
            max-width: 300px;
        }

        .recent-header {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            margin-bottom: 8px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recent-icon {
            font-size: 0.9rem;
        }

        .recent-name {
            flex: 1;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-badge {
            font-size: 0.5rem;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="vfx"></canvas>

    <div id="ui-layer">
        <div class="logo">aero</div>
        <div class="filename" id="filename"></div>
        <div class="progress-number" id="progressNumber">0</div>
        <div class="hint" id="hint">tap to send</div>
        <div class="status" id="status"></div>
        <div class="recents" id="recents"></div>
    </div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        /**
         * AERO Zero-Overhead Mobile Engine
         * Term-Phase 7: "Sip, don't Gulp"
         *
         * Features:
         * - Stream slicing with GC pacing (max 10MB chunks)
         * - Adaptive VFX (60FPS idle, 30FPS during transfer)
         * - Visibility handler (pause canvas when hidden)
         * - Memory-safe: explicit dereference after each chunk
         */
        (function () {
            'use strict';

            // ═══════════════════════════════════════════════════════════
            // CONSTANTS
            // ═══════════════════════════════════════════════════════════

            const MAX_CHUNK_SIZE = 10 * 1024 * 1024; // 10MB - safe for mobile
            const GC_YIELD_MS = 50; // Yield to GC between chunks
            const IV_SIZE = 16; // AES-CTR IV size (128-bit)

            // ═══════════════════════════════════════════════════════════
            // CRYPTO ENGINE ("The Optical Vault")
            // Term-Phase 8: AES-256-CTR encryption via WebCrypto
            // ═══════════════════════════════════════════════════════════

            let cryptoKey = null; // Imported AES-256 key
            let encryptionEnabled = false;
            let sessionIV = null; // Session IV for all chunks

            /**
             * Extract session key from URL hash fragment.
             * Hash fragments are NEVER sent in HTTP headers - invisible to sniffers.
             */
            function extractKeyFromHash() {
                const hash = window.location.hash;
                if (!hash || !hash.includes('key=')) {
                    console.log('[CRYPTO] No key in URL, plaintext mode');
                    return null;
                }
                const keyMatch = hash.match(/key=([A-Za-z0-9_-]+)/);
                return keyMatch ? keyMatch[1] : null;
            }

            /**
             * Import session key for WebCrypto AES-256-CTR.
             */
            async function importKey(base64Key) {
                try {
                    const keyStr = base64Key.replace(/-/g, '+').replace(/_/g, '/');
                    const keyBytes = Uint8Array.from(atob(keyStr), c => c.charCodeAt(0));
                    if (keyBytes.length !== 32) throw new Error('Invalid key size');

                    cryptoKey = await crypto.subtle.importKey(
                        'raw', keyBytes, { name: 'AES-CTR' }, false, ['encrypt']
                    );
                    sessionIV = crypto.getRandomValues(new Uint8Array(IV_SIZE));
                    encryptionEnabled = true;
                    console.log('[CRYPTO] ✅ AES-256-CTR enabled');
                    return true;
                } catch (e) {
                    console.error('[CRYPTO] ❌ Key import failed:', e);
                    return false;
                }
            }

            /**
             * Encrypt chunk with counter offset for streaming.
             */
            async function encryptChunk(buffer, chunkIndex) {
                if (!encryptionEnabled) return buffer;

                const counter = new Uint8Array(sessionIV);
                // Advance counter by chunk index
                const view = new DataView(counter.buffer);
                const offset = chunkIndex * Math.ceil(MAX_CHUNK_SIZE / 16);
                view.setBigUint64(8, BigInt(offset), false);

                return await crypto.subtle.encrypt(
                    { name: 'AES-CTR', counter, length: 64 },
                    cryptoKey, buffer
                );
            }

            /**
             * Get IV to prepend to first chunk.
             */
            function getSessionIV() {
                return sessionIV ? new Uint8Array(sessionIV) : null;
            }

            // Initialize crypto on page load
            (async () => {
                const key = extractKeyFromHash();
                if (key) await importKey(key);
            })();

            // ═══════════════════════════════════════════════════════════
            // HAPTIC FEEDBACK SYSTEM
            // Term-Phase 9: "Glass & Air" - Sharp ticks, not buzzy
            // ═══════════════════════════════════════════════════════════

            const haptics = {
                /** Tiny tick - like a watch gear (hover/orbit touch) */
                tick: () => navigator.vibrate?.(5),

                /** Start transfer */
                start: () => navigator.vibrate?.(20),

                /** Success - double tap */
                success: () => navigator.vibrate?.([50, 30, 50]),

                /** Error - long buzz */
                error: () => navigator.vibrate?.([300]),

                /** Peer connected */
                link: () => navigator.vibrate?.([10, 20, 10]),
            };

            // ═══════════════════════════════════════════════════════════
            // AUDIO ENGINE (Web Audio Synthesis)
            // No external files - sounds generated mathematically
            // ═══════════════════════════════════════════════════════════

            let audioCtx = null;
            let audioGain = null;
            let audioMuted = false;

            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    audioGain = audioCtx.createGain();
                    audioGain.gain.value = 0.3; // -10dB (subtle)
                    audioGain.connect(audioCtx.destination);
                    console.log('[AUDIO] ✅ Sound engine ready');
                } catch (e) {
                    console.warn('[AUDIO] ⚠️ Web Audio unavailable');
                }
            }

            const sounds = {
                /** Pop - peer connects */
                link: () => {
                    if (!audioCtx || audioMuted || document.hidden) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.05);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.4, now + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain).connect(audioGain);
                    osc.start(now);
                    osc.stop(now + 0.15);
                },

                /** Whoosh - transfer starts */
                ignite: () => {
                    if (!audioCtx || audioMuted || document.hidden) return;
                    const bufLen = audioCtx.sampleRate * 0.3;
                    const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buf;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.value = 2;
                    const gain = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    filter.frequency.setValueAtTime(200, now);
                    filter.frequency.exponentialRampToValueAtTime(4000, now + 0.25);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    noise.connect(filter).connect(gain).connect(audioGain);
                    noise.start(now);
                    noise.stop(now + 0.3);
                },

                /** Glassy chord - success */
                land: () => {
                    if (!audioCtx || audioMuted || document.hidden) return;
                    const now = audioCtx.currentTime;
                    [523.25, 659.25, 783.99, 987.77].forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        osc.frequency.value = freq;
                        const d = i * 0.02;
                        gain.gain.setValueAtTime(0, now + d);
                        gain.gain.linearRampToValueAtTime(0.15, now + d + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + d + 0.5);
                        osc.connect(gain).connect(audioGain);
                        osc.start(now + d);
                        osc.stop(now + d + 0.5);
                    });
                },

                /** Low thud - error */
                error: () => {
                    if (!audioCtx || audioMuted || document.hidden) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(80, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain).connect(audioGain);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            };

            // Init audio on first interaction
            document.addEventListener('click', initAudio, { once: true });
            document.addEventListener('touchstart', initAudio, { once: true });

            // ═══════════════════════════════════════════════════════════
            // DOM ELEMENTS
            // ═══════════════════════════════════════════════════════════

            const canvas = document.getElementById('vfx');
            const ctx = canvas.getContext('2d');
            const fileInput = document.getElementById('fileInput');
            const filenameEl = document.getElementById('filename');
            const progressNumber = document.getElementById('progressNumber');
            const hintEl = document.getElementById('hint');
            const statusEl = document.getElementById('status');
            const recentsDiv = document.getElementById('recents');

            // ═══════════════════════════════════════════════════════════
            // STATE
            // ═══════════════════════════════════════════════════════════

            let W, H, cx, cy;
            const RADIUS = 70;
            let state = 'idle'; // idle | transfer | burst
            let progress = 0;
            let burstR = 0;

            // VFX Performance Mode
            let vfxMode = 'high'; // high | eco
            let lastFrameTime = 0;
            let frameSkip = false;
            let isPageVisible = true;

            // ═══════════════════════════════════════════════════════════
            // VISIBILITY HANDLER (Battery Saver)
            // ═══════════════════════════════════════════════════════════

            document.addEventListener('visibilitychange', () => {
                isPageVisible = !document.hidden;
                if (isPageVisible && state !== 'idle') {
                    // Resume animation when page becomes visible
                    requestAnimationFrame(render);
                }
                console.log('[AERO] Page visibility:', isPageVisible ? 'visible' : 'hidden');
            });

            // ═══════════════════════════════════════════════════════════
            // ADAPTIVE VFX ENGINE
            // ═══════════════════════════════════════════════════════════

            function setPerformanceMode(mode) {
                vfxMode = mode;
                console.log('[VFX] Performance mode:', mode);
            }

            function hslToRgb(h, s, l) {
                s /= 100; l /= 100;
                const k = n => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
                return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
            }

            function getColor(offset, alpha) {
                const hue = (performance.now() * 0.03 + offset) % 360;
                const [r, g, b] = hslToRgb(hue, 80, 60);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
            }
            window.addEventListener('resize', resize);
            resize();

            function drawRing() {
                const t = performance.now() * 0.001;
                const breathe = 1 + Math.sin(t * 2) * 0.08;
                const r = RADIUS * breathe;

                // Glow (reduced in eco mode)
                if (vfxMode === 'high') {
                    const glow = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 1.8);
                    glow.addColorStop(0, getColor(0, 0.15));
                    glow.addColorStop(0.5, getColor(60, 0.08));
                    glow.addColorStop(1, 'transparent');
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = glow;
                    ctx.fill();
                }

                // Main ring
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = getColor(0, 0.6);
                ctx.lineWidth = 3;
                ctx.stroke();

                // Outer rings (skip in eco mode)
                if (vfxMode === 'high') {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + 15, 0, Math.PI * 2);
                    ctx.strokeStyle = getColor(90, 0.3);
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(cx, cy, r + 25, 0, Math.PI * 2);
                    ctx.strokeStyle = getColor(180, 0.15);
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Progress arc
                if (progress > 0 && state === 'transfer') {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + 8, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress / 100));
                    ctx.strokeStyle = getColor(0, 0.9);
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }

            function drawBurst() {
                burstR += (250 - burstR) * 0.08;
                const alpha = 1 - burstR / 250;
                const rings = vfxMode === 'high' ? 4 : 2; // Fewer in eco mode

                for (let i = 0; i < rings; i++) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, burstR * (1 - i * 0.2), 0, Math.PI * 2);
                    ctx.strokeStyle = getColor(i * 90, alpha * 0.4);
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                if (burstR > 240) {
                    state = 'idle';
                    burstR = 0;
                    setPerformanceMode('high'); // Restore quality
                }
            }

            function render() {
                // Skip if page hidden (Battery Saver)
                if (!isPageVisible) return;

                // Frame rate limiting in eco mode (30 FPS)
                const now = performance.now();
                if (vfxMode === 'eco') {
                    if (now - lastFrameTime < 33) { // ~30 FPS
                        requestAnimationFrame(render);
                        return;
                    }
                }
                lastFrameTime = now;

                // Clear with trail effect
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, W, H);

                drawRing();

                if (state === 'burst') {
                    drawBurst();
                }

                requestAnimationFrame(render);
            }
            render();

            // ═══════════════════════════════════════════════════════════
            // UI HANDLERS
            // ═══════════════════════════════════════════════════════════

            hintEl.addEventListener('click', () => {
                if (state === 'idle') fileInput.click();
            });

            document.addEventListener('click', () => {
                if (state === 'idle') fileInput.click();
            });

            // ═══════════════════════════════════════════════════════════
            // UTILS
            // ═══════════════════════════════════════════════════════════

            const recents = [];
            let ws = null;
            let uploadData = null;
            let receiveData = null;

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const addRecent = (name, type) => {
                recents.unshift({ name, type });
                if (recents.length > 3) recents.pop();
                const html = recents.length > 0 ? '<div class="recent-header">Recent</div>' + recents.map(r => {
                    const isSent = r.type === 'sent';
                    const color = isSent ? '#10b981' : '#3b82f6';
                    const bg = isSent ? 'rgba(16,185,129,0.12)' : 'rgba(59,130,246,0.12)';
                    return `<div class="recent-item">
                    <div class="recent-icon" style="color:${color}">${isSent ? '↑' : '↓'}</div>
                    <div class="recent-name">${r.name}</div>
                    <div class="recent-badge" style="background:${bg};color:${color}">${r.type}</div>
                </div>`;
                }).join('') : '';
                recentsDiv.innerHTML = html;
            };

            const reset = () => {
                state = 'idle';
                progress = 0;
                filenameEl.classList.remove('visible');
                progressNumber.classList.remove('visible');
                statusEl.classList.remove('visible');
                hintEl.classList.remove('hidden');
                uploadData = null;
                receiveData = null;
                setPerformanceMode('high');
            };

            // ═══════════════════════════════════════════════════════════
            // WEBSOCKET MESSAGE HANDLER
            // ═══════════════════════════════════════════════════════════

            const handleMessage = e => {
                if (e.data instanceof ArrayBuffer && receiveData) {
                    const idx = new DataView(e.data).getUint32(0, true);
                    receiveData.chunks[idx] = new Uint8Array(e.data, 4);
                    progress = Math.round((receiveData.chunks.filter(c => c).length / receiveData.total) * 100);
                    progressNumber.textContent = progress;
                    ws.send(JSON.stringify({ ack: idx }));
                    return;
                }

                try {
                    const msg = JSON.parse(e.data);

                    if (uploadData) {
                        if (msg.status === 'ready') uploadData.ready = true;
                        if (typeof msg.ack === 'number') {
                            uploadData.acked++;
                            progress = Math.round((uploadData.acked / uploadData.total) * 100);
                            progressNumber.textContent = progress;
                            statusEl.textContent = fmt(uploadData.sent / ((Date.now() - uploadData.t0) / 1000)) + '/s';
                            if (uploadData.acked >= uploadData.total && uploadData.done) uploadData.done();
                        }
                        if (msg.status === 'success') {
                            state = 'burst';
                            progressNumber.textContent = '✓';
                            statusEl.textContent = 'sent';
                            addRecent(uploadData.name, 'sent');
                            setTimeout(reset, 2500);
                        }
                    }

                    if (msg.type === 'file_incoming') {
                        state = 'transfer';
                        setPerformanceMode('eco'); // Reduce VFX during receive
                        receiveData = { name: msg.name, total: msg.chunks, chunks: new Array(msg.chunks) };
                        filenameEl.textContent = msg.name;
                        filenameEl.classList.add('visible');
                        progressNumber.textContent = '0';
                        progressNumber.classList.add('visible');
                        statusEl.textContent = 'receiving';
                        statusEl.classList.add('visible');
                        hintEl.classList.add('hidden');
                    }

                    if (msg.type === 'file_complete' && receiveData) {
                        const blob = new Blob(receiveData.chunks);
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = receiveData.name;
                        a.click();
                        state = 'burst';
                        progressNumber.textContent = '✓';
                        statusEl.textContent = 'saved';
                        addRecent(receiveData.name, 'received');
                        setTimeout(reset, 2500);
                    }
                } catch (err) { }
            };

            const connect = () => {
                ws = new WebSocket('ws://' + location.host + '/transfer');
                ws.binaryType = 'arraybuffer';
                ws.onmessage = handleMessage;
                ws.onclose = () => setTimeout(connect, 2000);
            };
            connect();

            // ═══════════════════════════════════════════════════════════
            // ZERO-OVERHEAD UPLOAD ENGINE
            // "Sip, don't Gulp" - Stream slicing with GC pacing
            // ═══════════════════════════════════════════════════════════

            /**
             * Upload file using surgical stream slicing.
             * Never loads entire file into memory.
             * Explicitly dereferences buffers to allow GC.
             * 
             * @param {File} file - The file to upload
             * @returns {Promise<{success: boolean, failedAt?: number}>}
             */
            async function upload(file) {
                if (state !== 'idle') return { success: false };

                state = 'transfer';
                setPerformanceMode('eco'); // Reduce VFX for CPU headroom

                const total = Math.ceil(file.size / MAX_CHUNK_SIZE);
                uploadData = {
                    name: file.name,
                    total,
                    acked: 0,
                    sent: 0,
                    t0: Date.now(),
                    ready: false,
                    done: null,
                    failedAt: null
                };

                // Setup UI
                filenameEl.textContent = file.name;
                filenameEl.classList.add('visible');
                progressNumber.textContent = '0';
                progressNumber.classList.add('visible');
                statusEl.textContent = 'connecting';
                statusEl.classList.add('visible');
                hintEl.classList.add('hidden');
                progress = 0;

                try {
                    // Signal file start
                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));

                    // Wait for server ready
                    await new Promise((resolve, reject) => {
                        const check = () => uploadData.ready ? resolve() : setTimeout(check, 10);
                        check();
                        setTimeout(() => reject(new Error('timeout')), 10000);
                    });

                    statusEl.textContent = 'sending';

                    // ═══════════════════════════════════════════════════════
                    // STREAM SLICING LOOP
                    // Key: Only one chunk in memory at a time
                    // ═══════════════════════════════════════════════════════

                    for (let i = 0; i < total; i++) {
                        const start = i * MAX_CHUNK_SIZE;
                        const end = Math.min((i + 1) * MAX_CHUNK_SIZE, file.size);

                        // 1. Create a Blob "pointer" (no memory allocation)
                        const slice = file.slice(start, end);

                        // 2. Read only this slice into memory
                        let buffer = await slice.arrayBuffer();

                        // 3. Prepare header (4-byte chunk index)
                        const header = new ArrayBuffer(4);
                        new DataView(header).setUint32(0, i, true);

                        // 4. Combine header + data
                        const packet = new Uint8Array(4 + buffer.byteLength);
                        packet.set(new Uint8Array(header), 0);
                        packet.set(new Uint8Array(buffer), 4);

                        // 5. Send packet
                        ws.send(packet);
                        uploadData.sent += buffer.byteLength;

                        // 6. CRITICAL: Dereference buffer immediately
                        // This allows GC to reclaim memory before next chunk
                        buffer = null;

                        // 7. Yield to browser (GC + UI updates)
                        if (i % 5 === 0) {
                            await new Promise(r => setTimeout(r, GC_YIELD_MS));
                        }
                    }

                    // Wait for all ACKs
                    statusEl.textContent = 'verifying';
                    await new Promise(resolve => {
                        uploadData.done = resolve;
                        if (uploadData.acked >= total) resolve();
                        setTimeout(resolve, 60000);
                    });

                    // Signal completion
                    ws.send(JSON.stringify({ done: true }));

                    return { success: true };

                } catch (e) {
                    console.error('[UPLOAD] Failed:', e);
                    statusEl.textContent = 'failed';
                    uploadData.failedAt = uploadData.sent;
                    state = 'idle';
                    setTimeout(reset, 2000);

                    // Return failure info for potential resume
                    return {
                        success: false,
                        failedAt: uploadData.sent,
                        error: e.message
                    };
                }
            }

            fileInput.onchange = () => {
                if (fileInput.files[0]) upload(fileInput.files[0]);
                fileInput.value = '';
            };

            // Expose for debugging
            window.AERO = { upload, setPerformanceMode, getState: () => ({ state, progress, vfxMode }) };
        })();
    </script>
</body>
