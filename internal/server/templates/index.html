<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
            user-select: none;
        }

        #vfx {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
            pointer-events: none;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }

        .filename {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            max-width: 80%;
            word-break: break-word;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .filename.visible {
            opacity: 1;
        }

        .progress-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.08);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .progress-number.visible {
            opacity: 1;
        }

        .hint {
            position: absolute;
            bottom: 140px;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            pointer-events: all;
            cursor: pointer;
        }

        .hint.hidden {
            opacity: 0;
        }

        .status {
            position: absolute;
            bottom: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status.visible {
            opacity: 1;
        }

        .recents {
            position: absolute;
            bottom: 24px;
            width: calc(100% - 48px);
            max-width: 300px;
        }

        .recent-header {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            margin-bottom: 8px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recent-icon {
            font-size: 0.9rem;
        }

        .recent-name {
            flex: 1;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-badge {
            font-size: 0.5rem;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="vfx"></canvas>

    <div id="ui-layer">
        <div class="logo">aero</div>
        <div class="filename" id="filename"></div>
        <div class="progress-number" id="progressNumber">0</div>
        <div class="hint" id="hint">tap to send</div>
        <div class="status" id="status"></div>
        <div class="recents" id="recents"></div>
    </div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('vfx');
            const ctx = canvas.getContext('2d');
            const fileInput = document.getElementById('fileInput');
            const filenameEl = document.getElementById('filename');
            const progressNumber = document.getElementById('progressNumber');
            const hintEl = document.getElementById('hint');
            const statusEl = document.getElementById('status');
            const recentsDiv = document.getElementById('recents');

            let W, H, cx, cy;
            const RADIUS = 70;

            function hslToRgb(h, s, l) {
                s /= 100; l /= 100;
                const k = n => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
                return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
            }

            function getColor(offset, alpha) {
                const hue = (performance.now() * 0.03 + offset) % 360;
                const [r, g, b] = hslToRgb(hue, 80, 60);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            let state = 'idle';
            let progress = 0;
            let burstR = 0;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
            }
            window.addEventListener('resize', resize);
            resize();

            function drawRing() {
                const t = performance.now() * 0.001;
                const breathe = 1 + Math.sin(t * 2) * 0.08;
                const r = RADIUS * breathe;

                const glow = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 1.8);
                glow.addColorStop(0, getColor(0, 0.15));
                glow.addColorStop(0.5, getColor(60, 0.08));
                glow.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = getColor(0, 0.6);
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx, cy, r + 15, 0, Math.PI * 2);
                ctx.strokeStyle = getColor(90, 0.3);
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx, cy, r + 25, 0, Math.PI * 2);
                ctx.strokeStyle = getColor(180, 0.15);
                ctx.lineWidth = 1;
                ctx.stroke();

                if (progress > 0 && state === 'transfer') {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + 8, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress / 100));
                    ctx.strokeStyle = getColor(0, 0.9);
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }

            function drawBurst() {
                burstR += (250 - burstR) * 0.08;
                const alpha = 1 - burstR / 250;

                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, burstR * (1 - i * 0.2), 0, Math.PI * 2);
                    ctx.strokeStyle = getColor(i * 90, alpha * 0.4);
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                if (burstR > 240) {
                    state = 'idle';
                    burstR = 0;
                }
            }

            function render() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, W, H);

                drawRing();

                if (state === 'burst') {
                    drawBurst();
                }

                requestAnimationFrame(render);
            }
            render();

            hintEl.addEventListener('click', () => {
                if (state === 'idle') fileInput.click();
            });

            document.addEventListener('click', () => {
                if (state === 'idle') fileInput.click();
            });

            const recents = [];
            let ws = null;
            let uploadData = null;
            let receiveData = null;

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const addRecent = (name, type) => {
                recents.unshift({ name, type });
                if (recents.length > 3) recents.pop();
                const html = recents.length > 0 ? '<div class="recent-header">Recent</div>' + recents.map(r => {
                    const isSent = r.type === 'sent';
                    const color = isSent ? '#10b981' : '#3b82f6';
                    const bg = isSent ? 'rgba(16,185,129,0.12)' : 'rgba(59,130,246,0.12)';
                    return `<div class="recent-item">
                    <div class="recent-icon" style="color:${color}">${isSent ? '↑' : '↓'}</div>
                    <div class="recent-name">${r.name}</div>
                    <div class="recent-badge" style="background:${bg};color:${color}">${r.type}</div>
                </div>`;
                }).join('') : '';
                recentsDiv.innerHTML = html;
            };

            const reset = () => {
                state = 'idle';
                progress = 0;
                filenameEl.classList.remove('visible');
                progressNumber.classList.remove('visible');
                statusEl.classList.remove('visible');
                hintEl.classList.remove('hidden');
                uploadData = null;
                receiveData = null;
            };

            const handleMessage = e => {
                if (e.data instanceof ArrayBuffer && receiveData) {
                    const idx = new DataView(e.data).getUint32(0, true);
                    receiveData.chunks[idx] = new Uint8Array(e.data, 4);
                    progress = Math.round((receiveData.chunks.filter(c => c).length / receiveData.total) * 100);
                    progressNumber.textContent = progress;
                    ws.send(JSON.stringify({ ack: idx }));
                    return;
                }

                try {
                    const msg = JSON.parse(e.data);

                    if (uploadData) {
                        if (msg.status === 'ready') uploadData.ready = true;
                        if (typeof msg.ack === 'number') {
                            uploadData.acked++;
                            progress = Math.round((uploadData.acked / uploadData.total) * 100);
                            progressNumber.textContent = progress;
                            statusEl.textContent = fmt(uploadData.sent / ((Date.now() - uploadData.t0) / 1000)) + '/s';
                            if (uploadData.acked >= uploadData.total && uploadData.done) uploadData.done();
                        }
                        if (msg.status === 'success') {
                            state = 'burst';
                            progressNumber.textContent = '✓';
                            statusEl.textContent = 'sent';
                            addRecent(uploadData.name, 'sent');
                            setTimeout(reset, 2500);
                        }
                    }

                    if (msg.type === 'file_incoming') {
                        state = 'transfer';
                        receiveData = { name: msg.name, total: msg.chunks, chunks: new Array(msg.chunks) };
                        filenameEl.textContent = msg.name;
                        filenameEl.classList.add('visible');
                        progressNumber.textContent = '0';
                        progressNumber.classList.add('visible');
                        statusEl.textContent = 'receiving';
                        statusEl.classList.add('visible');
                        hintEl.classList.add('hidden');
                    }

                    if (msg.type === 'file_complete' && receiveData) {
                        const blob = new Blob(receiveData.chunks);
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = receiveData.name;
                        a.click();
                        state = 'burst';
                        progressNumber.textContent = '✓';
                        statusEl.textContent = 'saved';
                        addRecent(receiveData.name, 'received');
                        setTimeout(reset, 2500);
                    }
                } catch (err) { }
            };

            const connect = () => {
                ws = new WebSocket('ws://' + location.host + '/transfer');
                ws.binaryType = 'arraybuffer';
                ws.onmessage = handleMessage;
                ws.onclose = () => setTimeout(connect, 2000);
            };
            connect();

            async function upload(file) {
                if (state !== 'idle') return;
                state = 'transfer';

                const CHUNK = 1024 * 1024;
                const total = Math.ceil(file.size / CHUNK);
                uploadData = { name: file.name, total, acked: 0, sent: 0, t0: Date.now(), ready: false, done: null };

                filenameEl.textContent = file.name;
                filenameEl.classList.add('visible');
                progressNumber.textContent = '0';
                progressNumber.classList.add('visible');
                statusEl.textContent = 'connecting';
                statusEl.classList.add('visible');
                hintEl.classList.add('hidden');
                progress = 0;

                try {
                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));
                    await new Promise((r, j) => {
                        const c = () => uploadData.ready ? r() : setTimeout(c, 10);
                        c(); setTimeout(() => j(new Error('timeout')), 10000);
                    });

                    statusEl.textContent = 'sending';
                    for (let i = 0; i < total; i++) {
                        const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                        const h = new ArrayBuffer(4);
                        new DataView(h).setUint32(0, i, true);
                        const c = new Uint8Array(4 + d.byteLength);
                        c.set(new Uint8Array(h), 0);
                        c.set(new Uint8Array(d), 4);
                        ws.send(c);
                        uploadData.sent += d.byteLength;
                    }

                    statusEl.textContent = 'verifying';
                    await new Promise(r => { uploadData.done = r; if (uploadData.acked >= total) r(); setTimeout(r, 60000); });
                    ws.send(JSON.stringify({ done: true }));
                } catch (e) {
                    statusEl.textContent = 'failed';
                    state = 'idle';
                    setTimeout(reset, 2000);
                }
            }

            fileInput.onchange = () => {
                if (fileInput.files[0]) upload(fileInput.files[0]);
                fileInput.value = '';
            };
        })();
    </script>
</body>

</html>
