<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AERO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --accent: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.12);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animated ambient glow */
        .ambient {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
            opacity: 0.5;
            filter: blur(80px);
            pointer-events: none;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.6;
            }
        }

        .container {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
        }

        .logo-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 2px;
            vertical-align: super;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.9);
            }
        }

        .tagline {
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        /* Drop Zone */
        .drop-zone {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 56px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .drop-zone:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .drop-zone.active {
            pointer-events: none;
            transform: scale(0.98);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 100%);
            border: 1px solid rgba(34, 197, 94, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .upload-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
            stroke-width: 1.5;
            fill: none;
        }

        .drop-zone:hover .upload-icon {
            transform: translateY(-4px);
        }

        .drop-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .drop-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        input[type="file"] {
            display: none;
        }

        /* Transfer Section */
        .transfer-section {
            display: none;
            margin-top: 28px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .transfer-section.visible {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .file-thumb {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .file-meta {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* Progress */
        .progress-container {
            margin-top: 20px;
        }

        .progress-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #4ade80);
            border-radius: 2px;
            transition: width 0.2s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.75rem;
        }

        .progress-percent {
            font-weight: 500;
            color: var(--accent);
        }

        .progress-speed {
            color: var(--text-muted);
            font-weight: 300;
        }

        /* Status */
        .status {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .status.visible {
            display: block;
        }

        .status.success {
            background: linear-gradient(135deg, var(--accent-soft), transparent);
            border: 1px solid rgba(34, 197, 94, 0.15);
        }

        .status.error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), transparent);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .status-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .status-message {
            font-size: 0.9rem;
            font-weight: 400;
        }

        .status.success .status-message {
            color: var(--accent);
        }

        .status.error .status-message {
            color: #ef4444;
        }

        /* Trust Badge */
        .trust-section {
            margin-top: 40px;
            text-align: center;
        }

        .trust-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .trust-dot {
            width: 4px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="ambient"></div>

    <div class="container">
        <section class="logo-section">
            <h1 class="logo">aero<span class="logo-dot"></span></h1>
            <p class="tagline">INSTANT FILE TRANSFER</p>
        </section>

        <div class="drop-zone" id="dropZone">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 15V3m0 0l-4 4m4-4l4 4" />
                    <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17" />
                </svg>
            </div>
            <div class="drop-title">Drop your file</div>
            <div class="drop-subtitle">or tap to select</div>
        </div>
        <input type="file" id="fileInput" accept="*/*">

        <div class="transfer-section" id="transferSection">
            <div class="file-card">
                <div class="file-thumb">📄</div>
                <div class="file-meta">
                    <div class="file-name" id="fileName">—</div>
                    <div class="file-size" id="fileSize">—</div>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-info">
                    <span class="progress-percent" id="progressPercent">0%</span>
                    <span class="progress-speed" id="progressSpeed">Preparing...</span>
                </div>
            </div>
        </div>

        <div class="status" id="statusBox">
            <div class="status-icon" id="statusIcon"></div>
            <div class="status-message" id="statusMessage"></div>
        </div>

        <div class="trust-section">
            <div class="trust-badge">
                <span>Local network</span>
                <span class="trust-dot"></span>
                <span>No cloud</span>
                <span class="trust-dot"></span>
                <span>Private</span>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';
            const $ = id => document.getElementById(id);
            const dropZone = $('dropZone'), fileInput = $('fileInput');
            const transferSection = $('transferSection'), progressBar = $('progressBar');
            const progressPercent = $('progressPercent'), progressSpeed = $('progressSpeed');
            const fileName = $('fileName'), fileSize = $('fileSize');
            const statusBox = $('statusBox'), statusIcon = $('statusIcon'), statusMessage = $('statusMessage');

            const CHUNK_SIZE = 1024 * 1024;

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const showStatus = (type, icon, msg) => {
                statusBox.className = 'status visible ' + type;
                statusIcon.textContent = icon;
                statusMessage.textContent = msg;
            };

            async function upload(file) {
                const t0 = Date.now();
                dropZone.classList.add('active');
                transferSection.classList.add('visible');
                statusBox.classList.remove('visible');

                fileName.textContent = file.name;
                fileSize.textContent = fmt(file.size);
                progressBar.style.width = '0%';
                progressPercent.textContent = '0%';
                progressSpeed.textContent = 'Connecting...';

                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                let acked = 0, sent = 0;

                try {
                    const ws = new WebSocket(`ws://${location.host}/transfer`);
                    ws.binaryType = 'arraybuffer';
                    await new Promise((res, rej) => { ws.onopen = res; ws.onerror = rej; });

                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: totalChunks }));
                    await new Promise(res => { ws.onmessage = e => { if (JSON.parse(e.data).status === 'ready') res(); }; });

                    progressSpeed.textContent = 'Transferring...';

                    let done;
                    ws.onmessage = e => {
                        try {
                            const m = JSON.parse(e.data);
                            if (typeof m.ack === 'number') {
                                acked++;
                                const p = (acked / totalChunks) * 100;
                                const s = sent / ((Date.now() - t0) / 1000);
                                progressBar.style.width = Math.min(99, p) + '%';
                                progressPercent.textContent = Math.round(p) + '%';
                                progressSpeed.textContent = fmt(s) + '/s';
                                if (done && acked >= totalChunks) done();
                            } else if (m.status && done) done(m);
                        } catch { }
                    };

                    for (let i = 0; i < totalChunks; i++) {
                        const d = await file.slice(i * CHUNK_SIZE, Math.min((i + 1) * CHUNK_SIZE, file.size)).arrayBuffer();
                        const h = new ArrayBuffer(4); new DataView(h).setUint32(0, i, true);
                        const c = new Uint8Array(4 + d.byteLength);
                        c.set(new Uint8Array(h), 0); c.set(new Uint8Array(d), 4);
                        ws.send(c); sent += d.byteLength;
                    }

                    progressSpeed.textContent = 'Verifying...';
                    await new Promise(r => { done = r; if (acked >= totalChunks) r(); setTimeout(r, 60000); });

                    ws.send(JSON.stringify({ done: true }));
                    await new Promise(r => { ws.onmessage = () => r(); setTimeout(r, 30000); });
                    ws.close();

                    progressBar.style.width = '100%';
                    progressPercent.textContent = '100%';
                    const sec = ((Date.now() - t0) / 1000).toFixed(1);
                    showStatus('success', '✓', `Transferred in ${sec}s`);

                } catch (e) {
                    showStatus('error', '✗', e.message);
                } finally {
                    dropZone.classList.remove('active');
                }
            }

            dropZone.onclick = () => fileInput.click();
            dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
            dropZone.ondragleave = () => dropZone.classList.remove('dragover');
            dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
            fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };
        })();
    </script>
</body>

</html>
