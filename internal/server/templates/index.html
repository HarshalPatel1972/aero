<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
            user-select: none;
        }

        /* Layer 1: The Void Canvas */
        #vfx {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Layer 2: The Data - Glass Morphism Overlay */
        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
        }

        /* Logo - Subtle, Top */
        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }

        /* Hero Filename - MASSIVE Swiss Style */
        .filename {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            letter-spacing: -0.02em;
            max-width: 80%;
            word-break: break-word;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .filename.visible {
            opacity: 1;
        }

        /* The Massive Progress Number */
        .progress-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.08);
            mix-blend-mode: overlay;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .progress-number.visible {
            opacity: 1;
        }

        /* Swipe Hint */
        .hint {
            position: absolute;
            bottom: 120px;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: opacity 0.5s ease;
        }

        .hint.hidden {
            opacity: 0;
        }

        /* Status Text */
        .status {
            position: absolute;
            bottom: 80px;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status.visible {
            opacity: 1;
        }

        /* Recents at bottom */
        .recents {
            position: absolute;
            bottom: 24px;
            width: calc(100% - 48px);
            max-width: 300px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recent-icon {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .recent-name {
            flex: 1;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="vfx"></canvas>

    <div id="ui-layer">
        <div class="logo">aero</div>
        <div class="filename" id="filename"></div>
        <div class="progress-number" id="progressNumber">0</div>
        <div class="hint" id="hint">↑ swipe to send</div>
        <div class="status" id="status"></div>
        <div class="recents" id="recents"></div>
    </div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        // ═══════════════════════════════════════════════════════════════
        // CHROMATIC FLUID ENGINE - "Galactic Iridescence"
        // ═══════════════════════════════════════════════════════════════

        const canvas = document.getElementById('vfx');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const filenameEl = document.getElementById('filename');
        const progressNumber = document.getElementById('progressNumber');
        const hintEl = document.getElementById('hint');
        const statusEl = document.getElementById('status');
        const recentsDiv = document.getElementById('recents');

        let W, H, centerX, centerY;
        const RING_RADIUS = 80;

        // Iridescent color generator
        const getIridescentColor = (offset = 0, saturation = 100, lightness = 60) => {
            const hue = (performance.now() * 0.05 + offset) % 360;
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        };

        // ═══════════════════════════════════════════════════════════════
        // CHROMATIC FLUID CLASS
        // ═══════════════════════════════════════════════════════════════
        class ChromaticFluid {
            constructor() {
                this.state = 'idle'; // idle, charging, beam, burst
                this.ringPhase = 0;
                this.beamIntensity = 0;
                this.burstRadius = 0;
                this.progress = 0;
            }

            drawBreathingRing() {
                const time = performance.now() * 0.001;
                const breathe = Math.sin(time * 2) * 0.15 + 1;
                const r = RING_RADIUS * breathe;

                // Multiple rings with different hue offsets
                for (let i = 0; i < 3; i++) {
                    const offset = i * 120;
                    const alpha = 0.3 - i * 0.08;
                    const ringR = r + i * 15;

                    // Gradient for ring
                    const gradient = ctx.createRadialGradient(
                        centerX, centerY, ringR - 10,
                        centerX, centerY, ringR + 10
                    );
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(0.5, getIridescentColor(offset, 100, 50).replace(')', `, ${alpha})`).replace('hsl', 'hsla'));
                    gradient.addColorStop(1, 'transparent');

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, ringR, 0, Math.PI * 2);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                // Core glow
                const coreGrad = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, r * 0.8
                );
                coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
                coreGrad.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(centerX, centerY, r * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = coreGrad;
                ctx.fill();

                // Undulating wave effect on ring
                ctx.beginPath();
                for (let a = 0; a < Math.PI * 2; a += 0.05) {
                    const wave = Math.sin(a * 6 + time * 3) * 5;
                    const px = centerX + Math.cos(a) * (r + wave);
                    const py = centerY + Math.sin(a) * (r + wave);
                    if (a === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = getIridescentColor(0, 80, 70).replace(')', ', 0.4)').replace('hsl', 'hsla');
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            drawBeam() {
                const time = performance.now() * 0.002;
                const beamWidth = 60 + Math.sin(time * 5) * 10;

                // The vertical light pillar
                const gradient = ctx.createLinearGradient(centerX - beamWidth, 0, centerX + beamWidth, 0);
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(0.2, getIridescentColor(0, 100, 60).replace(')', ', 0.3)').replace('hsl', 'hsla'));
                gradient.addColorStop(0.5, getIridescentColor(60, 100, 80).replace(')', ', 0.6)').replace('hsl', 'hsla'));
                gradient.addColorStop(0.8, getIridescentColor(120, 100, 60).replace(')', ', 0.3)').replace('hsl', 'hsla'));
                gradient.addColorStop(1, 'transparent');

                // Main beam
                ctx.fillStyle = gradient;
                ctx.fillRect(centerX - beamWidth, 0, beamWidth * 2, H);

                // Hot white core
                ctx.save();
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#fff';

                const coreWidth = 8 + Math.sin(time * 8) * 4;
                const coreGrad = ctx.createLinearGradient(centerX - coreWidth, 0, centerX + coreWidth, 0);
                coreGrad.addColorStop(0, 'transparent');
                coreGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)');
                coreGrad.addColorStop(1, 'transparent');

                ctx.fillStyle = coreGrad;
                ctx.fillRect(centerX - coreWidth, 0, coreWidth * 2, H);
                ctx.restore();

                // Energy pulses traveling up
                const pulseCount = 5;
                for (let i = 0; i < pulseCount; i++) {
                    const pulseY = ((time * 200 + i * (H / pulseCount)) % H);
                    const pulseAlpha = 0.5 - Math.abs(pulseY - centerY) / H;

                    ctx.beginPath();
                    ctx.ellipse(centerX, H - pulseY, beamWidth * 0.8, 20, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, pulseAlpha * 0.3)})`;
                    ctx.fill();
                }
            }

            drawBurst() {
                this.burstRadius += (300 - this.burstRadius) * 0.1;
                const alpha = Math.max(0, 1 - this.burstRadius / 300);

                // Expanding chromatic rings
                for (let i = 0; i < 5; i++) {
                    const r = this.burstRadius * (1 - i * 0.15);
                    if (r > 0) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                        ctx.strokeStyle = getIridescentColor(i * 60, 100, 70).replace(')', `, ${alpha * 0.5})`).replace('hsl', 'hsla');
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                }

                // Central flash
                ctx.save();
                ctx.shadowBlur = 50;
                ctx.shadowColor = '#fff';
                const flashGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, this.burstRadius * 0.5);
                flashGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                flashGrad.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(centerX, centerY, this.burstRadius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = flashGrad;
                ctx.fill();
                ctx.restore();

                if (this.burstRadius > 290) {
                    this.state = 'idle';
                    this.burstRadius = 0;
                }
            }

            update() {
                this.ringPhase += 0.02;
            }

            draw() {
                if (this.state === 'idle' || this.state === 'charging') {
                    this.drawBreathingRing();
                }
                if (this.state === 'beam') {
                    this.drawBeam();
                    this.drawBreathingRing();
                }
                if (this.state === 'burst') {
                    this.drawBurst();
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // RENDER LOOP
        // ═══════════════════════════════════════════════════════════════
        const fluid = new ChromaticFluid();

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            centerX = W / 2;
            centerY = H / 2;
        }

        function render() {
            // Clear with fade for trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, W, H);

            fluid.update();
            fluid.draw();

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        render();

        // ═══════════════════════════════════════════════════════════════
        // SWIPE INTERACTION
        // ═══════════════════════════════════════════════════════════════
        let touchStartY = 0;
        let isSwiping = false;

        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            isSwiping = true;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            const deltaY = touchStartY - e.touches[0].clientY;
            if (deltaY > 50 && fluid.state === 'idle') {
                fluid.state = 'charging';
                hintEl.classList.add('hidden');
                fileInput.click();
                isSwiping = false;
            }
        });

        document.addEventListener('touchend', () => { isSwiping = false; });

        // Fallback: click to open file
        document.addEventListener('click', () => {
            if (fluid.state === 'idle') {
                hintEl.classList.add('hidden');
                fileInput.click();
            }
        });

        // ═══════════════════════════════════════════════════════════════
        // UPLOAD & WEBSOCKET LOGIC
        // ═══════════════════════════════════════════════════════════════
        const recents = [];
        let ws = null;
        let uploadData = null;
        let receiveData = null;
        let currentState = 'idle';

        const fmt = b => {
            if (!b) return '0 B';
            const i = Math.floor(Math.log(b) / Math.log(1024));
            return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
        };

        const addRecent = (name, type) => {
            recents.unshift({ name, type });
            if (recents.length > 2) recents.pop();
            recentsDiv.innerHTML = recents.map(r => `
            <div class="recent-item">
                <div class="recent-icon">${r.type === 'sent' ? '↑' : '↓'}</div>
                <div class="recent-name">${r.name}</div>
            </div>
        `).join('');
        };

        const resetUI = () => {
            currentState = 'idle';
            fluid.state = 'idle';
            filenameEl.classList.remove('visible');
            progressNumber.classList.remove('visible');
            statusEl.classList.remove('visible');
            hintEl.classList.remove('hidden');
            uploadData = null;
            receiveData = null;
        };

        const handleMessage = (e) => {
            if (e.data instanceof ArrayBuffer && currentState === 'receiving' && receiveData) {
                const idx = new DataView(e.data).getUint32(0, true);
                receiveData.chunks[idx] = new Uint8Array(e.data, 4);
                const pct = Math.round((receiveData.chunks.filter(c => c).length / receiveData.meta.chunks) * 100);
                progressNumber.textContent = pct;
                ws.send(JSON.stringify({ ack: idx }));
                return;
            }

            try {
                const msg = JSON.parse(e.data);

                if (currentState === 'uploading' && uploadData) {
                    if (msg.status === 'ready') uploadData.ready = true;
                    if (typeof msg.ack === 'number') {
                        uploadData.acked++;
                        const pct = Math.round((uploadData.acked / uploadData.total) * 100);
                        progressNumber.textContent = pct;
                        statusEl.textContent = fmt(uploadData.sent / ((Date.now() - uploadData.t0) / 1000)) + '/s';
                        if (uploadData.acked >= uploadData.total && uploadData.doneResolve) uploadData.doneResolve();
                    }
                    if (msg.status === 'success') {
                        fluid.state = 'burst';
                        progressNumber.textContent = '✓';
                        statusEl.textContent = 'sent';
                        addRecent(uploadData.name, 'sent');
                        setTimeout(resetUI, 2500);
                    }
                    return;
                }

                if (msg.type === 'file_incoming') {
                    currentState = 'receiving';
                    fluid.state = 'beam';
                    receiveData = { meta: msg, chunks: new Array(msg.chunks) };
                    filenameEl.textContent = msg.name;
                    filenameEl.classList.add('visible');
                    progressNumber.textContent = '0';
                    progressNumber.classList.add('visible');
                    statusEl.textContent = 'receiving';
                    statusEl.classList.add('visible');
                    hintEl.classList.add('hidden');
                }

                if (msg.type === 'file_complete' && receiveData) {
                    const blob = new Blob(receiveData.chunks);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = receiveData.meta.name;
                    a.click();
                    fluid.state = 'burst';
                    progressNumber.textContent = '✓';
                    statusEl.textContent = 'saved';
                    addRecent(receiveData.meta.name, 'received');
                    setTimeout(resetUI, 2500);
                }
            } catch { }
        };

        const connect = () => {
            ws = new WebSocket(`ws://${location.host}/transfer`);
            ws.binaryType = 'arraybuffer';
            ws.onmessage = handleMessage;
            ws.onclose = () => setTimeout(connect, 2000);
        };
        connect();

        async function upload(file) {
            if (currentState !== 'idle') return;
            currentState = 'uploading';
            fluid.state = 'beam';

            const CHUNK = 1024 * 1024;
            const total = Math.ceil(file.size / CHUNK);
            uploadData = { name: file.name, total, acked: 0, sent: 0, t0: Date.now(), ready: false, doneResolve: null };

            filenameEl.textContent = file.name;
            filenameEl.classList.add('visible');
            progressNumber.textContent = '0';
            progressNumber.classList.add('visible');
            statusEl.textContent = 'connecting';
            statusEl.classList.add('visible');

            try {
                ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));
                await new Promise((r, j) => {
                    const c = () => uploadData.ready ? r() : setTimeout(c, 10);
                    c(); setTimeout(() => j(new Error('timeout')), 10000);
                });

                statusEl.textContent = 'sending';
                for (let i = 0; i < total; i++) {
                    const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                    const h = new ArrayBuffer(4); new DataView(h).setUint32(0, i, true);
                    const c = new Uint8Array(4 + d.byteLength);
                    c.set(new Uint8Array(h), 0); c.set(new Uint8Array(d), 4);
                    ws.send(c);
                    uploadData.sent += d.byteLength;
                }

                statusEl.textContent = 'verifying';
                await new Promise(r => { uploadData.doneResolve = r; if (uploadData.acked >= total) r(); setTimeout(r, 60000); });
                ws.send(JSON.stringify({ done: true }));
            } catch (e) {
                statusEl.textContent = 'failed';
                fluid.state = 'idle';
                setTimeout(resetUI, 2000);
            }
        }

        fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); fileInput.value = ''; };
    </script>
</body>

</html>
