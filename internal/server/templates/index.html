<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.4);
            --green-dim: rgba(0, 255, 136, 0.1);
            --blue: #00aaff;
            --blue-glow: rgba(0, 170, 255, 0.4);
            --blue-dim: rgba(0, 170, 255, 0.1);
            --black: #000000;
            --white: #ffffff;
            --dim: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        /* ═══════════════════════════════════════════
           SACRED LOGO - NEVER CHANGE
           ═══════════════════════════════════════════ */
        .logo {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 48px;
        }

        .logo-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            margin-left: 1px;
            vertical-align: super;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px var(--green-glow);
        }

        .logo-dot.receive {
            background: var(--blue);
            box-shadow: 0 0 10px var(--blue-glow);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(0.8);
            }
        }

        /* ═══════════════════════════════════════════
           THE ORB - Clean, Centered, Vibrant
           ═══════════════════════════════════════════ */
        .orb {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
        }

        /* Glow behind */
        .orb-glow {
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.5;
            animation: glow-pulse 3s ease-in-out infinite;
            transition: background 0.5s ease;
        }

        .orb-glow.receive {
            background: radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
        }

        @keyframes glow-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        /* Outer ring */
        .orb-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transition: border-color 0.3s ease;
        }

        .orb:hover .orb-ring {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Progress ring */
        .progress-svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .progress-svg circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .progress-track {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            stroke: var(--green);
            stroke-dasharray: 628;
            stroke-dashoffset: 628;
            transition: stroke-dashoffset 0.2s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px var(--green));
        }

        .progress-fill.receive {
            stroke: var(--blue);
            filter: drop-shadow(0 0 8px var(--blue));
        }

        /* Center content */
        .orb-center {
            position: absolute;
            inset: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .orb:hover .orb-center {
            background: rgba(255, 255, 255, 0.04);
        }

        .orb.success .orb-center {
            background: var(--green-dim);
        }

        .orb-icon {
            font-size: 2.5rem;
            margin-bottom: 4px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .orb:hover .orb-icon {
            transform: translateY(-2px);
        }

        .orb.success .orb-icon {
            color: var(--green);
        }

        .orb.receive .orb-icon {
            color: var(--blue);
        }

        .orb-text {
            font-size: 0.7rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 400;
        }

        /* ═══════════════════════════════════════════
           STATS - Only visible during transfer
           ═══════════════════════════════════════════ */
        .stats {
            margin-top: 32px;
            text-align: center;
            height: 80px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .stats.visible {
            opacity: 1;
        }

        .stat-percent {
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--green);
            transition: color 0.3s ease;
        }

        .stat-percent.receive {
            color: var(--blue);
        }

        .stat-speed {
            font-size: 0.75rem;
            color: var(--dim);
            margin-top: 2px;
        }

        .stat-file {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 8px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ═══════════════════════════════════════════
           RECENTS - Compact history
           ═══════════════════════════════════════════ */
        .recents {
            width: 100%;
            margin-top: 24px;
            max-height: 150px;
            overflow-y: auto;
        }

        .recent-header {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            text-align: center;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .recent-icon {
            font-size: 0.8rem;
            width: 20px;
            text-align: center;
        }

        .recent-icon.sent {
            color: var(--green);
        }

        .recent-icon.received {
            color: var(--blue);
        }

        .recent-name {
            flex: 1;
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-badge {
            font-size: 0.5rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .recent-badge.sent {
            background: var(--green-dim);
            color: var(--green);
        }

        .recent-badge.received {
            background: var(--blue-dim);
            color: var(--blue);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="logo">aero<span class="logo-dot" id="logoDot"></span></h1>

        <div class="orb" id="orb">
            <div class="orb-glow" id="orbGlow"></div>
            <div class="orb-ring"></div>

            <svg class="progress-svg" viewBox="0 0 200 200">
                <circle class="progress-track" cx="100" cy="100" r="99" />
                <circle class="progress-fill" id="progressFill" cx="100" cy="100" r="99" />
            </svg>

            <div class="orb-center">
                <div class="orb-icon" id="orbIcon">↑</div>
                <div class="orb-text" id="orbText">tap to send</div>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-percent" id="statPercent">0%</div>
            <div class="stat-speed" id="statSpeed">—</div>
            <div class="stat-file" id="statFile">—</div>
        </div>

        <div class="recents" id="recents"></div>
    </div>

    <input type="file" id="fileInput" accept="*/*">

    <script>
        (function () {
            const $ = id => document.getElementById(id);
            const orb = $('orb'), fileInput = $('fileInput');
            const orbIcon = $('orbIcon'), orbText = $('orbText'), orbGlow = $('orbGlow');
            const logoDot = $('logoDot'), progressFill = $('progressFill');
            const stats = $('stats'), statPercent = $('statPercent'), statSpeed = $('statSpeed'), statFile = $('statFile');
            const recentsDiv = $('recents');

            const circumference = 2 * Math.PI * 99;
            progressFill.style.strokeDasharray = circumference;
            progressFill.style.strokeDashoffset = circumference;

            const recents = [];
            const MAX_RECENTS = 5;

            // State
            let ws = null;
            let uploadState = null; // { acked, total, done }
            let receiveState = null; // { chunks, meta }

            const fmt = b => {
                if (!b) return '0 B';
                const i = Math.floor(Math.log(b) / Math.log(1024));
                return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };

            const setProgress = pct => {
                progressFill.style.strokeDashoffset = circumference - (pct / 100) * circumference;
            };

            const setMode = mode => {
                const isReceive = mode === 'receive';
                logoDot.classList.toggle('receive', isReceive);
                orbGlow.classList.toggle('receive', isReceive);
                progressFill.classList.toggle('receive', isReceive);
                statPercent.classList.toggle('receive', isReceive);
                orb.classList.toggle('receive', isReceive);
            };

            const addRecent = (name, type) => {
                recents.unshift({ name, type });
                if (recents.length > MAX_RECENTS) recents.pop();
                renderRecents();
            };

            const renderRecents = () => {
                if (recents.length === 0) { recentsDiv.innerHTML = ''; return; }
                recentsDiv.innerHTML = `
                <div class="recent-header">Recent</div>
                ${recents.map(r => `
                    <div class="recent-item">
                        <div class="recent-icon ${r.type}">${r.type === 'sent' ? '↑' : '↓'}</div>
                        <div class="recent-name">${r.name}</div>
                        <div class="recent-badge ${r.type}">${r.type}</div>
                    </div>
                `).join('')}
            `;
            };

            const resetToIdle = () => {
                setMode('send');
                orb.classList.remove('success');
                orbIcon.textContent = '↑';
                orbText.textContent = 'tap to send';
                stats.classList.remove('visible');
                setProgress(0);
                uploadState = null;
                receiveState = null;
            };

            // ═══════════════════════════════════════════
            // SINGLE PERSISTENT MESSAGE ROUTER
            // ═══════════════════════════════════════════
            const handleMessage = (e) => {
                // Binary = chunk data
                if (e.data instanceof ArrayBuffer) {
                    if (receiveState) {
                        const view = new DataView(e.data);
                        const idx = view.getUint32(0, true);
                        const data = new Uint8Array(e.data, 4);
                        receiveState.chunks[idx] = data;

                        const received = receiveState.chunks.filter(c => c).length;
                        const pct = (received / receiveState.meta.chunks) * 100;
                        setProgress(Math.min(99, pct));
                        statPercent.textContent = Math.round(pct) + '%';

                        ws.send(JSON.stringify({ ack: idx }));
                    }
                    return;
                }

                // Text = JSON message
                try {
                    const msg = JSON.parse(e.data);

                    // Server ready for upload
                    if (msg.status === 'ready' && uploadState) {
                        uploadState.ready = true;
                    }

                    // ACK from server during upload
                    if (typeof msg.ack === 'number' && uploadState) {
                        uploadState.acked++;
                        const pct = Math.min(99, (uploadState.acked / uploadState.total) * 100);
                        setProgress(pct);
                        statPercent.textContent = Math.round(pct) + '%';
                        statSpeed.textContent = fmt(uploadState.sent / ((Date.now() - uploadState.t0) / 1000)) + '/s';

                        if (uploadState.acked >= uploadState.total && uploadState.doneResolve) {
                            uploadState.doneResolve();
                        }
                    }

                    // Upload complete confirmation
                    if (msg.status === 'success' && uploadState) {
                        setProgress(100);
                        statPercent.textContent = '100%';
                        orb.classList.add('success');
                        orbIcon.textContent = '✓';
                        orbText.textContent = 'sent';
                        const sec = ((Date.now() - uploadState.t0) / 1000).toFixed(1);
                        statSpeed.textContent = sec + 's';
                        addRecent(uploadState.name, 'sent');
                        setTimeout(resetToIdle, 2000);
                    }

                    // Incoming file from PC
                    if (msg.type === 'file_incoming') {
                        receiveState = {
                            meta: { name: msg.name, size: msg.size, chunks: msg.chunks },
                            chunks: new Array(msg.chunks)
                        };
                        setMode('receive');
                        stats.classList.add('visible');
                        orbIcon.textContent = '↓';
                        orbText.textContent = 'receiving';
                        statFile.textContent = msg.name;
                        statPercent.textContent = '0%';
                        statSpeed.textContent = 'from PC...';
                        setProgress(0);
                    }

                    // File complete from PC
                    if (msg.type === 'file_complete' && receiveState) {
                        const blob = new Blob(receiveState.chunks);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = receiveState.meta.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        setProgress(100);
                        statPercent.textContent = '100%';
                        orb.classList.add('success');
                        orbIcon.textContent = '✓';
                        orbText.textContent = 'saved';
                        statSpeed.textContent = 'downloaded';
                        addRecent(receiveState.meta.name, 'received');
                        setTimeout(resetToIdle, 2000);
                    }

                } catch (err) {
                    console.error('Parse error:', err);
                }
            };

            const connect = () => {
                ws = new WebSocket(`ws://${location.host}/transfer`);
                ws.binaryType = 'arraybuffer';
                ws.onmessage = handleMessage; // SINGLE PERSISTENT HANDLER
                ws.onclose = () => setTimeout(connect, 2000);
            };

            connect();
            orb.onclick = () => fileInput.click();

            // ═══════════════════════════════════════════
            // UPLOAD FUNCTION
            // ═══════════════════════════════════════════
            async function upload(file) {
                const CHUNK = 1024 * 1024;
                const total = Math.ceil(file.size / CHUNK);

                uploadState = {
                    name: file.name,
                    total,
                    acked: 0,
                    sent: 0,
                    t0: Date.now(),
                    ready: false,
                    doneResolve: null
                };

                setMode('send');
                orb.classList.remove('success');
                stats.classList.add('visible');
                orbIcon.textContent = '↑';
                orbText.textContent = 'sending';
                statFile.textContent = file.name;
                statPercent.textContent = '0%';
                statSpeed.textContent = 'connecting...';
                setProgress(0);

                try {
                    // Send init
                    ws.send(JSON.stringify({ name: file.name, size: file.size, chunks: total }));

                    // Wait for ready
                    await new Promise(r => {
                        const check = () => uploadState.ready ? r() : setTimeout(check, 10);
                        check();
                        setTimeout(r, 10000); // Timeout
                    });

                    statSpeed.textContent = 'transferring...';

                    // Send all chunks
                    for (let i = 0; i < total; i++) {
                        const d = await file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size)).arrayBuffer();
                        const h = new ArrayBuffer(4);
                        new DataView(h).setUint32(0, i, true);
                        const c = new Uint8Array(4 + d.byteLength);
                        c.set(new Uint8Array(h), 0);
                        c.set(new Uint8Array(d), 4);
                        ws.send(c);
                        uploadState.sent += d.byteLength;
                    }

                    // Wait for all ACKs
                    statSpeed.textContent = 'verifying...';
                    await new Promise(r => {
                        uploadState.doneResolve = r;
                        if (uploadState.acked >= total) r();
                        setTimeout(r, 60000);
                    });

                    // Signal done
                    ws.send(JSON.stringify({ done: true }));

                } catch (e) {
                    orbIcon.textContent = '✗';
                    orbText.textContent = 'failed';
                    statSpeed.textContent = e.message;
                    setTimeout(resetToIdle, 3000);
                }
            }

            fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };
        })();
    </script>
</body>

</html>
