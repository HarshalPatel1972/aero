<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>Aero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050505;
            --bg-surface: rgba(26, 26, 26, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --cyan: #00E5FF;
            --cyan-glow: rgba(0, 229, 255, 0.3);
            --text: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-void);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            padding-top: calc(env(safe-area-inset-top, 16px) + 24px);
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* Title Bar */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--cyan), #00B8D4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #000;
        }

        .logo-text {
            font-weight: 600;
            font-size: 15px;
        }

        .connection-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--cyan);
        }

        .connection-dot {
            width: 6px;
            height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        /* Action Button */
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover,
        .action-btn:active {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Transfer Panel */
        .transfer-panel {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: none;
        }

        .transfer-panel.active {
            display: block;
        }

        .transfer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .transfer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transfer-icon {
            width: 32px;
            height: 32px;
            background: rgba(0, 229, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transfer-icon svg {
            width: 16px;
            height: 16px;
            color: var(--cyan);
        }

        .transfer-name {
            font-size: 13px;
            font-weight: 600;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transfer-status {
            font-size: 11px;
            color: var(--text-muted);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--cyan);
            text-transform: uppercase;
        }

        .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .cancel-btn {
            width: 100%;
            padding: 10px 0 4px 0;
            margin-top: 8px;
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.25);
            background: none;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: color 0.2s;
        }

        .cancel-btn:hover {
            color: #ef4444;
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), #00B8D4);
            border-radius: 3px;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: space-between;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value.highlight {
            color: var(--cyan);
        }

        /* Recent Files */
        .recents {
            width: 100%;
            max-width: 320px;
        }

        .recents-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-align: center;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .recent-icon {
            width: 28px;
            height: 28px;
            background: rgba(0, 229, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .recent-name {
            flex: 1;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-badge {
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
            background: rgba(0, 229, 255, 0.1);
            color: var(--cyan);
        }

        /* Stats Banner */
        .stats-banner {
            width: 100%;
            max-width: 320px;
            padding: 10px 16px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            border-radius: 12px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .stats-banner.show {
            opacity: 1;
            transform: translateY(0);
        }

        .stats-banner-content {
            font-size: 15px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: #10b981;
            text-align: center;
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            color: var(--text-muted);
            font-size: 11px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="logo">
                <div class="logo-icon">A</div>
                <span class="logo-text">Aero</span>
            </div>
            <div class="connection-badge">
                <div class="connection-dot"></div>
                Connected
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Stats Banner (permanent display) -->
            <div class="stats-banner" id="statsBanner">
                <div class="stats-banner-content" id="statsContent">--</div>
            </div>

            <h1 class="main-title" id="mainTitle">Send Files to PC</h1>

            <!-- Action Button -->
            <button class="action-btn" id="selectBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                Select Files
            </button>

            <!-- Transfer Panel -->
            <div class="transfer-panel" id="transferPanel">
                <div class="transfer-header">
                    <div class="transfer-info">
                        <div class="transfer-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </div>
                        <div>
                            <div class="transfer-name" id="fileName">file.zip</div>
                            <div class="transfer-status" id="transferStatus">Sending...</div>
                        </div>
                    </div>
                    <div class="live-badge">Live</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-label">Speed</div>
                        <div class="stat-value highlight" id="speedStat">0 MB/s</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Progress</div>
                        <div class="stat-value" id="progressStat">0%</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">ETA</div>
                        <div class="stat-value" id="etaStat">--</div>
                    </div>
                </div>
                <button class="cancel-btn" id="cancelBtn">Tap to cancel</button>
            </div>

            <!-- Recent Files -->
            <div class="recents" id="recents"></div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <span>Connected to PC</span>
        </div>
    </div>

    <input type="file" id="fileInput" multiple>

    <script>
        /**
         * AERO Mobile Client
         * Matching desktop aesthetic with glassmorphism design
         */
        (function () {
            'use strict';

            const MAX_CHUNK_SIZE = 10 * 1024 * 1024;
            const IV_SIZE = 16;

            // DOM
            const selectBtn = document.getElementById('selectBtn');
            const fileInput = document.getElementById('fileInput');
            const transferPanel = document.getElementById('transferPanel');
            const fileName = document.getElementById('fileName');
            const transferStatus = document.getElementById('transferStatus');
            const progressFill = document.getElementById('progressFill');
            const speedStat = document.getElementById('speedStat');
            const progressStat = document.getElementById('progressStat');
            const etaStat = document.getElementById('etaStat');
            const recentsDiv = document.getElementById('recents');
            const mainTitle = document.getElementById('mainTitle');
            const cancelBtn = document.getElementById('cancelBtn');
            const statsBanner = document.getElementById('statsBanner');
            const statsContent = document.getElementById('statsContent');

            // State
            let recentFiles = [];
            let cryptoKey = null;
            let encryptionEnabled = false;
            let sessionIV = null;
            let activeXHR = null; // For cancel functionality

            // Crypto functions
            function extractKeyFromHash() {
                const hash = window.location.hash;
                if (!hash || !hash.includes('key=')) return null;
                const keyMatch = hash.match(/key=([A-Za-z0-9_-]+)/);
                return keyMatch ? keyMatch[1] : null;
            }

            async function importKey(base64Key) {
                try {
                    const keyStr = base64Key.replace(/-/g, '+').replace(/_/g, '/');
                    const keyBytes = Uint8Array.from(atob(keyStr), c => c.charCodeAt(0));
                    if (keyBytes.length !== 32) throw new Error('Invalid key size');
                    cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CTR' }, false, ['encrypt']);
                    sessionIV = crypto.getRandomValues(new Uint8Array(IV_SIZE));
                    encryptionEnabled = true;
                    console.log('[CRYPTO] ✅ Encryption enabled');
                    return true;
                } catch (e) {
                    console.error('[CRYPTO] ❌ Key import failed:', e);
                    return false;
                }
            }

            async function encryptChunk(buffer, chunkIndex) {
                if (!encryptionEnabled) return buffer;
                const counter = new Uint8Array(sessionIV);
                const view = new DataView(counter.buffer);
                const offset = chunkIndex * Math.ceil(MAX_CHUNK_SIZE / 16);
                view.setBigUint64(8, BigInt(offset), false);
                return await crypto.subtle.encrypt({ name: 'AES-CTR', counter, length: 64 }, cryptoKey, buffer);
            }

            // Init crypto
            (async () => {
                const key = extractKeyFromHash();
                if (key) await importKey(key);
            })();

            // ═══════════════════════════════════════════════════════════
            // WebSocket Client (Phone -> PC presence & Download)
            // ═══════════════════════════════════════════════════════════

            let ws;
            let incomingFile = null;
            let receivedChunks = [];
            let receivedBytes = 0;
            let receiveStartTime = 0;
            let receiveLastTime = 0;
            let receiveLastBytes = 0;

            function connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/transfer`);
                ws.binaryType = 'arraybuffer'; // Critical for binary handling

                ws.onopen = () => {
                    document.querySelector('.bottom-bar span').textContent = 'Connected to PC';
                    document.querySelector('.bottom-bar span').style.color = '#22d3ee'; // Aero Cyan
                    haptics.success();
                };

                ws.onclose = () => {
                    document.querySelector('.bottom-bar span').textContent = 'Disconnected...';
                    document.querySelector('.bottom-bar span').style.color = '#ef4444'; // Red
                    setTimeout(connectWebSocket, 2000);
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        handleBinaryChunk(event.data);
                    } else {
                        try {
                            const msg = JSON.parse(event.data);
                            handleControlMessage(msg);
                        } catch (e) { console.error(e); }
                    }
                };
            }

            function handleControlMessage(msg) {
                if (msg.type === 'file_incoming') {
                    // Start download UI
                    incomingFile = msg;
                    receivedChunks = [];
                    receivedBytes = 0;
                    receiveStartTime = Date.now();
                    receiveLastTime = receiveStartTime;
                    receiveLastBytes = 0;

                    mainTitle.textContent = 'Receiving...';
                    fileName.textContent = msg.name;
                    transferStatus.textContent = formatBytes(msg.size);
                    transferPanel.classList.add('active');
                    selectBtn.style.display = 'none';
                    haptics.tick();
                }
                else if (msg.type === 'file_complete') {
                    // Finish & Save
                    transferComplete(msg.name, true);
                    saveFile(msg.name);
                }
            }

            function handleBinaryChunk(buffer) {
                // Strip 4-byte header (chunk index)
                const data = buffer.slice(4);
                receivedChunks.push(data);
                receivedBytes += data.byteLength;

                // Update UI
                if (incomingFile) {
                    const progress = Math.min(100, Math.round((receivedBytes / incomingFile.size) * 100));
                    progressFill.style.width = progress + '%';
                    progressStat.textContent = progress + '%';

                    const now = Date.now();
                    const timeDiff = (now - receiveLastTime) / 1000;
                    if (timeDiff >= 0.5) {
                        const bytesDiff = receivedBytes - receiveLastBytes;
                        const speed = bytesDiff / timeDiff;
                        speedStat.textContent = formatSpeed(speed);

                        const remaining = incomingFile.size - receivedBytes;
                        const eta = speed > 0 ? remaining / speed : 0;
                        etaStat.textContent = formatEta(eta);

                        receiveLastTime = now;
                        receiveLastBytes = receivedBytes;
                    }
                }
            }

            function saveFile(filename) {
                const blob = new Blob(receivedChunks, { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                addRecentFile(filename, 'received');
            }

            // Connect immediately
            connectWebSocket();

            // File selection
            selectBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                for (const file of files) {
                    await uploadFile(file);
                }
                fileInput.value = '';
            });

            // Cancel button
            cancelBtn.addEventListener('click', () => {
                if (activeXHR) {
                    activeXHR.abort();
                    activeXHR = null;
                    transferCancelled();
                }
            });

            function transferCancelled() {
                mainTitle.textContent = 'Cancelled';
                transferStatus.textContent = 'Transfer cancelled';
                haptics.error();

                setTimeout(() => {
                    transferPanel.classList.remove('active');
                    selectBtn.style.display = 'flex';
                    mainTitle.textContent = 'Send Files to PC';
                    progressFill.style.width = '0%';
                }, 1500);
            }

            // Upload file
            // 🚀 SPEED PHASE 3: Parallel Multi-Stream Upload (50+ MB/s)
            async function uploadFile(file) {
                mainTitle.textContent = 'Sending...';
                fileName.textContent = file.name;
                transferStatus.textContent = 'Uploading...';
                transferPanel.classList.add('active');
                selectBtn.style.display = 'none';

                const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB per chunk
                const MAX_PARALLEL = 6; // 6 concurrent streams
                const totalSize = file.size;
                const totalChunks = Math.ceil(totalSize / CHUNK_SIZE);
                const sessionId = Date.now().toString() + Math.random().toString(36);

                let startTime = Date.now();
                let lastTime = startTime;
                let lastBytes = 0;

                // Track progress for each chunk
                const chunkProgress = new Array(totalChunks).fill(0);
                const activeUploads = new Set();
                const uploadQueue = [];

                // Populate upload queue
                for (let i = 0; i < totalChunks; i++) {
                    uploadQueue.push(i);
                }

                // Upload single chunk
                const uploadChunk = async (chunkIdx) => {
                    const start = chunkIdx * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, totalSize);
                    const blob = file.slice(start, end);

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/parallel-upload', true);

                    // Set headers for parallel upload
                    xhr.setRequestHeader('X-Session-Id', sessionId);
                    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
                    xhr.setRequestHeader('X-Chunk-Index', chunkIdx.toString());
                    xhr.setRequestHeader('X-Total-Chunks', totalChunks.toString());
                    xhr.setRequestHeader('X-Offset', start.toString());
                    xhr.setRequestHeader('X-Total-Size', totalSize.toString());

                    // Track individual chunk progress
                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            chunkProgress[chunkIdx] = e.loaded;
                            updateTotalProgress();
                        }
                    };

                    return new Promise((resolve, reject) => {
                        xhr.onload = () => {
                            if (xhr.status === 200) {
                                chunkProgress[chunkIdx] = blob.size; // Mark complete
                                resolve(chunkIdx);
                            } else {
                                reject(new Error(`Chunk ${chunkIdx} failed`));
                            }
                        };
                        xhr.onerror = () => reject(new Error(`Chunk ${chunkIdx} network error`));
                        xhr.send(blob);
                    });
                };

                // Update aggregated progress from all streams
                const updateTotalProgress = () => {
                    const uploaded = chunkProgress.reduce((a, b) => a + b, 0);
                    const progress = Math.min(100, Math.round((uploaded / totalSize) * 100));

                    progressFill.style.width = progress + '%';
                    progressStat.textContent = progress + '%';

                    const now = Date.now();
                    const timeDiff = (now - lastTime) / 1000;
                    if (timeDiff >= 0.5) {
                        const bytesDiff = uploaded - lastBytes;
                        const speed = bytesDiff / timeDiff;
                        speedStat.textContent = formatSpeed(speed);

                        const remaining = totalSize - uploaded;
                        const eta = speed > 0 ? remaining / speed : 0;
                        etaStat.textContent = formatEta(eta);

                        lastTime = now;

                        try {
                            // Upload in batches of MAX_PARALLEL chunks
                            // This ensures ALL chunks complete before moving to next batch
                            for (let batchStart = 0; batchStart < totalChunks; batchStart += MAX_PARALLEL) {
                                const batchEnd = Math.min(batchStart + MAX_PARALLEL, totalChunks);
                                const batch = [];

                                // Create batch of uploads
                                for (let i = batchStart; i < batchEnd; i++) {
                                    batch.push(uploadChunk(i));
                                }

                                // Wait for ENTIRE batch to complete
                                await Promise.all(batch);

                                console.log(`Batch ${batchStart}-${batchEnd - 1} complete`);
                            }

                            // All chunks uploaded
                            console.log('All chunks uploaded successfully');
                            const totalTime = (Date.now() - startTime) / 1000;
                            const avgSpeed = totalSize / totalTime;
                            transferComplete(file.name, true, totalSize, totalTime, avgSpeed);

                        } catch (error) {
                            console.error('Parallel upload failed:', error);
                            transferComplete(file.name, false);
                        }
                    }

                    function transferComplete(name, success, totalBytes, totalTime, avgSpeed) {
                        activeXHR = null; // Clear reference

                        // Show stats in permanent banner
                        if (success && totalBytes && totalTime) {
                            const speedMBps = (avgSpeed / (1024 * 1024)).toFixed(1);
                            const timeSec = totalTime.toFixed(1);

                            // Update banner (permanent)
                            statsContent.textContent = `${speedMBps} MB/s | ${timeSec}s`;
                            statsBanner.classList.add('show');
                            // No timeout - stays visible

                            console.log(`[STATS] 📊 ${name}: ${speedMBps} MB/s | ${timeSec}s`);
                        }

                        // Update transfer panel (which will hide after 2s)
                        mainTitle.textContent = success ? 'Transfer Complete!' : 'Transfer Failed';
                        transferStatus.textContent = success ? 'Sent successfully' : 'Error occurred';
                        progressFill.style.width = '100%';
                        progressStat.textContent = '100%';

                        if (success) {
                            addRecentFile(name, 'sent');
                        }

                        setTimeout(() => {
                            transferPanel.classList.remove('active');
                            selectBtn.style.display = 'flex';
                            mainTitle.textContent = 'Send Files to PC';
                            progressFill.style.width = '0%';
                        }, 2000);
                    }

                    function addRecentFile(name, type) {
                        recentFiles.unshift({ name, type, time: Date.now() });
                        if (recentFiles.length > 3) recentFiles.pop();
                        renderRecents();
                    }

                    function renderRecents() {
                        if (recentFiles.length === 0) {
                            recentsDiv.innerHTML = '';
                            return;
                        }

                        let html = '<div class="recents-header">Recent Transfers</div>';
                        recentFiles.forEach(f => {
                            const icon = f.type === 'sent' ? '↑' : '↓';
                            html += `
                        <div class="recent-item">
                            <div class="recent-icon">${icon}</div>
                            <div class="recent-name">${f.name}</div>
                            <div class="recent-badge">${f.type}</div>
                        </div>
                    `;
                        });
                        recentsDiv.innerHTML = html;
                    }

                    function formatSpeed(bytesPerSec) {
                        if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
                        if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
                        return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
                    }

                    function formatEta(seconds) {
                        if (!seconds || seconds === Infinity) return '--';
                        if (seconds < 60) return Math.ceil(seconds) + 's';
                        const mins = Math.floor(seconds / 60);
                        const secs = Math.ceil(seconds % 60);
                        return mins + 'm ' + secs + 's';
                    }

                    // Haptics
                    const haptics = {
                        tick: () => navigator.vibrate?.(5),
                        success: () => navigator.vibrate?.([50, 30, 50]),
                        error: () => navigator.vibrate?.([300]),
                    };
                })();
    </script>
</body>
